<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equivalent Fractions Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4a4a4a;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
            font-size: 1rem;
        }

        .progress-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .question-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .question-label {
            color: #764ba2;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .fraction-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 1.8rem;
            color: #4a4a4a;
            flex-wrap: wrap;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .numerator, .denominator {
            padding: 5px 15px;
        }

        .fraction-line {
            width: 100%;
            height: 3px;
            background: #4a4a4a;
            border-radius: 2px;
        }

        .equals {
            font-size: 2rem;
            color: #764ba2;
            font-weight: bold;
        }

        .input-field {
            background: white;
            border: 3px solid #667eea;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1.5rem;
            width: 80px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.3);
        }

        .input-field.correct {
            border-color: #27ae60;
            background: #e8f8f0;
        }

        .input-field.incorrect {
            border-color: #e74c3c;
            background: #fdf2f2;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-next {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            margin-top: 15px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.4);
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #d4efdf 0%, #a9dfbf 100%);
            border-left: 5px solid #27ae60;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #fadbd8 0%, #f5b7b1 100%);
            border-left: 5px solid #e74c3c;
        }

        .feedback-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback.correct .feedback-title {
            color: #1e8449;
        }

        .feedback.incorrect .feedback-title {
            color: #c0392b;
        }

        .feedback-text {
            color: #555;
            line-height: 1.6;
        }

        .feedback-text strong {
            color: #764ba2;
        }

        .score-display {
            text-align: center;
            padding: 40px;
        }

        .score-display h2 {
            color: #4a4a4a;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-message {
            color: #666;
            font-size: 1.2rem;
            margin: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        .icon {
            font-size: 1.5rem;
        }

        @media (max-width: 500px) {
            .fraction-display {
                font-size: 1.4rem;
                gap: 10px;
            }

            .input-field {
                width: 60px;
                font-size: 1.2rem;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧮 Equivalent Fractions</h1>
            <p>Find the missing value to make the fractions equal</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Question 1 of 17</div>

        <div id="quizArea">
            <div class="question-card">
                <div class="question-label">Find the missing value</div>
                <div class="fraction-display" id="fractionDisplay">
                    <!-- Dynamic content -->
                </div>
            </div>

            <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
            <button class="btn btn-next hidden" id="nextBtn" onclick="nextQuestion()">Next Question →</button>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedbackTitle"></div>
                <div class="feedback-text" id="feedbackText"></div>
            </div>
        </div>

        <div class="score-display hidden" id="scoreDisplay">
            <h2>🎉 Quiz Complete!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="score-message" id="scoreMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                left: { num: "2", den: "3" },
                right: { num: "?", den: "18" },
                answer: "12",
                blankPosition: "rightNum",
                explanation: "To go from 3 to 18, we multiply by 6. So we must also multiply 2 by 6: 2 × 6 = 12. Therefore, 2/3 = 12/18."
            },
            {
                left: { num: "5", den: "6" },
                right: { num: "20", den: "?" },
                answer: "24",
                blankPosition: "rightDen",
                explanation: "To go from 5 to 20, we multiply by 4. So we must also multiply 6 by 4: 6 × 4 = 24. Therefore, 5/6 = 20/24."
            },
            {
                left: { num: "3", den: "5" },
                right: { num: "?", den: "15" },
                answer: "9",
                blankPosition: "rightNum",
                explanation: "To go from 5 to 15, we multiply by 3. So we must also multiply 3 by 3: 3 × 3 = 9. Therefore, 3/5 = 9/15."
            },
            {
                left: { num: "4", den: "7" },
                right: { num: "14", den: "?" },
                answer: "24.5",
                blankPosition: "rightDen",
                explanation: "To go from 4 to 14, we multiply by 3.5. So we must also multiply 7 by 3.5: 7 × 3.5 = 24.5. Therefore, 4/7 = 14/24.5. (Note: This creates an unusual equivalent fraction!)"
            },
            {
                left: { num: "3", den: "7" },
                right: { num: "?", den: "21" },
                answer: "9",
                blankPosition: "rightNum",
                explanation: "To go from 7 to 21, we multiply by 3. So we must also multiply 3 by 3: 3 × 3 = 9. Therefore, 3/7 = 9/21."
            },
            {
                left: { num: "9", den: "11" },
                right: { num: "18", den: "?" },
                answer: "22",
                blankPosition: "rightDen",
                explanation: "To go from 9 to 18, we multiply by 2. So we must also multiply 11 by 2: 11 × 2 = 22. Therefore, 9/11 = 18/22."
            },
            {
                left: { num: "2x", den: "5" },
                right: { num: "?", den: "10" },
                answer: "4x",
                blankPosition: "rightNum",
                explanation: "To go from 5 to 10, we multiply by 2. So we must also multiply 2x by 2: 2x × 2 = 4x. Therefore, 2x/5 = 4x/10."
            },
            {
                left: { num: "3a", den: "8" },
                right: { num: "6a", den: "?" },
                answer: "16",
                blankPosition: "rightDen",
                explanation: "To go from 3a to 6a, we multiply by 2. So we must also multiply 8 by 2: 8 × 2 = 16. Therefore, 3a/8 = 6a/16."
            },
            {
                left: { num: "a", den: "4" },
                right: { num: "15", den: "20" },
                answer: "3",
                blankPosition: "leftNum",
                displayAs: "a = ?",
                explanation: "First, simplify 15/20 = 3/4. Since a/4 = 3/4, we know a = 3."
            },
            {
                left: { num: "?", den: "18" },
                right: { num: "5", den: "6" },
                answer: "15",
                blankPosition: "leftNum",
                explanation: "To go from 6 to 18, we multiply by 3. So we must also multiply 5 by 3: 5 × 3 = 15. Therefore, 15/18 = 5/6."
            },
            {
                left: { num: "3", den: "?" },
                right: { num: "12", den: "20" },
                answer: "5",
                blankPosition: "leftDen",
                explanation: "To go from 3 to 12, we multiply by 4. So we must find what times 4 gives 20: 20 ÷ 4 = 5. Therefore, 3/5 = 12/20."
            },
            {
                left: { num: "4", den: "?" },
                right: { num: "12", den: "21" },
                answer: "7",
                blankPosition: "leftDen",
                explanation: "To go from 4 to 12, we multiply by 3. So we must find what times 3 gives 21: 21 ÷ 3 = 7. Therefore, 4/7 = 12/21."
            },
            {
                left: { num: "3", den: "12a" },
                right: { num: "?", den: "4a" },
                answer: "1",
                blankPosition: "rightNum",
                explanation: "To go from 12a to 4a, we divide by 3. So we must also divide 3 by 3: 3 ÷ 3 = 1. Therefore, 3/12a = 1/4a."
            },
            {
                left: { num: "5", den: "8b" },
                right: { num: "15", den: "?" },
                answer: "24b",
                blankPosition: "rightDen",
                explanation: "To go from 5 to 15, we multiply by 3. So we must also multiply 8b by 3: 8b × 3 = 24b. Therefore, 5/8b = 15/24b."
            },
            {
                left: { num: "a", den: "b" },
                right: { num: "ax", den: "?" },
                answer: "bx",
                blankPosition: "rightDen",
                explanation: "To go from a to ax, we multiply by x. So we must also multiply b by x: b × x = bx. Therefore, a/b = ax/bx."
            },
            {
                left: { num: "3", den: "5" },
                right: { num: "?", den: "5" },
                answer: "3",
                blankPosition: "rightNum",
                explanation: "Since both fractions have the same denominator (5), and they must be equal, the numerators must also be the same. So ? = 3."
            },
            {
                left: { num: "30", den: "?" },
                right: { num: "5", den: "8" },
                answer: "48",
                blankPosition: "leftDen",
                explanation: "To go from 5 to 30, we multiply by 6. So we must also multiply 8 by 6: 8 × 6 = 48. Therefore, 30/48 = 5/8."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const display = document.getElementById('fractionDisplay');
            
            let leftNum = q.left.num;
            let leftDen = q.left.den;
            let rightNum = q.right.num;
            let rightDen = q.right.den;

            // Create input field for the blank position
            const inputHTML = `<input type="text" class="input-field" id="answerInput" autocomplete="off" onkeypress="handleKeyPress(event)">`;

            if (q.blankPosition === "leftNum") {
                leftNum = inputHTML;
            } else if (q.blankPosition === "leftDen") {
                leftDen = inputHTML;
            } else if (q.blankPosition === "rightNum") {
                rightNum = inputHTML;
            } else if (q.blankPosition === "rightDen") {
                rightDen = inputHTML;
            }

            display.innerHTML = `
                <div class="fraction">
                    <div class="numerator">${leftNum}</div>
                    <div class="fraction-line"></div>
                    <div class="denominator">${leftDen}</div>
                </div>
                <div class="equals">=</div>
                <div class="fraction">
                    <div class="numerator">${rightNum}</div>
                    <div class="fraction-line"></div>
                    <div class="denominator">${rightDen}</div>
                </div>
            `;

            // Focus the input
            setTimeout(() => {
                const input = document.getElementById('answerInput');
                if (input) input.focus();
            }, 100);

            updateProgress();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !answered) {
                checkAnswer();
            }
        }

        function checkAnswer() {
            if (answered) return;

            const input = document.getElementById('answerInput');
            const userAnswer = input.value.trim().toLowerCase().replace(/\s/g, '');
            const q = questions[currentQuestion];
            const correctAnswer = q.answer.toLowerCase().replace(/\s/g, '');

            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');

            answered = true;

            if (userAnswer === correctAnswer) {
                score++;
                input.classList.add('correct');
                feedback.className = 'feedback correct';
                feedbackTitle.innerHTML = '<span class="icon">✅</span> Correct!';
                feedbackText.innerHTML = `<strong>Well done!</strong> ${q.explanation}`;
            } else {
                input.classList.add('incorrect');
                feedback.className = 'feedback incorrect';
                feedbackTitle.innerHTML = '<span class="icon">❌</span> Not quite right';
                feedbackText.innerHTML = `<strong>The correct answer is: ${q.answer}</strong><br><br>${q.explanation}`;
            }

            feedback.style.display = 'block';
            document.getElementById('checkBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
            input.disabled = true;
        }

        function nextQuestion() {
            currentQuestion++;
            answered = false;

            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('checkBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            renderQuestion();
        }

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        }

        function showResults() {
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('scoreDisplay').classList.remove('hidden');
            document.querySelector('.progress-container').classList.add('hidden');
            document.querySelector('.progress-text').classList.add('hidden');

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;

            let message = '';
            if (percentage === 100) {
                message = '🌟 Perfect score! You\'re a fraction master!';
            } else if (percentage >= 80) {
                message = '🎯 Excellent work! You really understand equivalent fractions!';
            } else if (percentage >= 60) {
                message = '👍 Good job! Keep practicing to improve!';
            } else if (percentage >= 40) {
                message = '📚 Nice effort! Review the explanations and try again!';
            } else {
                message = '💪 Keep learning! Practice makes perfect!';
            }

            document.getElementById('scoreMessage').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = false;

            document.getElementById('quizArea').classList.remove('hidden');
            document.getElementById('scoreDisplay').classList.add('hidden');
            document.querySelector('.progress-container').classList.remove('hidden');
            document.querySelector('.progress-text').classList.remove('hidden');

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('checkBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            renderQuestion();
        }

        // Initialize the quiz
        renderQuestion();
    </script>
</body>
</html>
