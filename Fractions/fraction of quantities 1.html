<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractions of Quantities - Math Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            height: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .content {
            padding: 40px;
        }

        .question-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
        }

        .question-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.8rem;
            color: #333;
            font-weight: 600;
        }

        .fraction {
            color: #e74c3c;
            font-weight: 700;
        }

        .quantity {
            color: #2980b9;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            border: 3px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-next {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            margin-top: 15px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }

        .feedback {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            display: none;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-left: 5px solid #27ae60;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-left: 5px solid #e74c3c;
        }

        .feedback-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .feedback-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .feedback.correct .feedback-title {
            color: #27ae60;
        }

        .feedback.incorrect .feedback-title {
            color: #e74c3c;
        }

        .correct-answer {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1.2rem;
        }

        .correct-answer strong {
            color: #27ae60;
        }

        .explanation {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
        }

        .explanation h4 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .explanation p {
            color: #555;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .explanation .step {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .score-display {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 10px;
        }

        .score-display span {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .completion-screen {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .completion-screen h2 {
            font-size: 2rem;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 4rem;
            font-weight: 700;
            color: #667eea;
            margin: 30px 0;
        }

        .completion-message {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
        }

        .trophy {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .bounce {
            animation: bounce 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📐 Fractions of Quantities</h1>
            <p>Practice finding fractions of different measurements</p>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text">Question <span id="currentQ">1</span> of <span id="totalQ">15</span></div>
        </div>

        <div class="content" id="quizContent">
            <div class="score-display">
                Score: <span id="score">0</span> / <span id="attempted">0</span>
            </div>

            <div class="question-card" id="questionCard">
                <div class="question-label">Find the value of</div>
                <div class="question-text" id="questionText"></div>
            </div>

            <div class="input-group">
                <label for="answer">Your Answer:</label>
                <input type="text" id="answer" placeholder="Enter your answer..." autocomplete="off">
                <div class="hint" id="hintText"></div>
            </div>

            <button class="btn btn-primary" id="submitBtn" onclick="checkAnswer()">Check Answer</button>

            <div class="feedback" id="feedback">
                <div class="feedback-icon" id="feedbackIcon"></div>
                <div class="feedback-title" id="feedbackTitle"></div>
                <div class="correct-answer" id="correctAnswer"></div>
                <div class="explanation" id="explanation"></div>
                <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
            </div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <div class="trophy">🏆</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="completion-message" id="completionMessage"></div>
            <button class="btn btn-restart" onclick="restartQuiz()">Try Again 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                fraction: "3/8",
                quantity: "£4",
                answer: "£1.50",
                acceptedAnswers: ["£1.50", "1.50", "£1.5", "1.5"],
                hint: "Answer in pounds (e.g., £1.50)",
                explanation: {
                    steps: [
                        "First, find 1/8 of £4: £4 ÷ 8 = £0.50",
                        "Then multiply by 3: £0.50 × 3 = £1.50"
                    ],
                    summary: "To find 3/8 of £4, divide £4 by 8 to get one eighth (£0.50), then multiply by 3."
                }
            },
            {
                fraction: "3/4",
                quantity: "3 hours",
                answer: "2 hours 15 minutes",
                acceptedAnswers: ["2 hours 15 minutes", "2h 15min", "2 h 15 min", "2:15", "135 minutes", "135 min", "2 hours 15 min", "2h 15m", "2 hr 15 min"],
                hint: "Answer in hours and minutes",
                explanation: {
                    steps: [
                        "3 hours = 180 minutes",
                        "Find 1/4 of 180 minutes: 180 ÷ 4 = 45 minutes",
                        "Multiply by 3: 45 × 3 = 135 minutes",
                        "Convert: 135 minutes = 2 hours 15 minutes"
                    ],
                    summary: "Convert to minutes first (180 min), find 3/4 (135 min), then convert back to hours and minutes."
                }
            },
            {
                fraction: "7/10",
                quantity: "5 kg",
                answer: "3.5 kg",
                acceptedAnswers: ["3.5 kg", "3.5kg", "3.5", "3½ kg", "3 1/2 kg"],
                hint: "Answer in kilograms",
                explanation: {
                    steps: [
                        "Find 1/10 of 5 kg: 5 ÷ 10 = 0.5 kg",
                        "Multiply by 7: 0.5 × 7 = 3.5 kg"
                    ],
                    summary: "Divide 5 by 10 to get one tenth (0.5 kg), then multiply by 7 to get 3.5 kg."
                }
            },
            {
                fraction: "4/5",
                quantity: "3 m",
                answer: "2.4 m",
                acceptedAnswers: ["2.4 m", "2.4m", "2.4", "2.40 m", "240 cm"],
                hint: "Answer in metres",
                explanation: {
                    steps: [
                        "Find 1/5 of 3 m: 3 ÷ 5 = 0.6 m",
                        "Multiply by 4: 0.6 × 4 = 2.4 m"
                    ],
                    summary: "Divide 3 by 5 to get one fifth (0.6 m), then multiply by 4 to get 2.4 m."
                }
            },
            {
                fraction: "3/8",
                quantity: "5 lb",
                answer: "1 lb 14 oz",
                acceptedAnswers: ["1 lb 14 oz", "1lb 14oz", "1 pound 14 ounces", "30 oz", "30oz", "1.875 lb", "1 lb 14 ounces"],
                hint: "Answer in pounds and ounces (16 oz = 1 lb)",
                explanation: {
                    steps: [
                        "5 lb = 80 oz (5 × 16)",
                        "Find 1/8 of 80 oz: 80 ÷ 8 = 10 oz",
                        "Multiply by 3: 10 × 3 = 30 oz",
                        "Convert: 30 oz = 1 lb 14 oz"
                    ],
                    summary: "Convert to ounces (80 oz), find 3/8 (30 oz), then convert back: 30 ÷ 16 = 1 remainder 14."
                }
            },
            {
                fraction: "5/6",
                quantity: "4 ft",
                answer: "3 ft 4 in",
                acceptedAnswers: ["3 ft 4 in", "3ft 4in", "3 feet 4 inches", "40 in", "40in", "40 inches", "3 ft 4 inches"],
                hint: "Answer in feet and inches (12 in = 1 ft)",
                explanation: {
                    steps: [
                        "4 ft = 48 in (4 × 12)",
                        "Find 1/6 of 48 in: 48 ÷ 6 = 8 in",
                        "Multiply by 5: 8 × 5 = 40 in",
                        "Convert: 40 in = 3 ft 4 in"
                    ],
                    summary: "Convert to inches (48 in), find 5/6 (40 in), then convert back: 40 ÷ 12 = 3 remainder 4."
                }
            },
            {
                fraction: "2/3",
                quantity: "£2.70",
                answer: "£1.80",
                acceptedAnswers: ["£1.80", "1.80", "£1.8", "1.8"],
                hint: "Answer in pounds",
                explanation: {
                    steps: [
                        "Find 1/3 of £2.70: £2.70 ÷ 3 = £0.90",
                        "Multiply by 2: £0.90 × 2 = £1.80"
                    ],
                    summary: "Divide £2.70 by 3 to get one third (£0.90), then multiply by 2 to get £1.80."
                }
            },
            {
                fraction: "3/4",
                quantity: "2 h 24 min",
                answer: "1 h 48 min",
                acceptedAnswers: ["1 h 48 min", "1h 48min", "1 hour 48 minutes", "108 min", "108 minutes", "1:48", "1 hr 48 min", "1h48m"],
                hint: "Answer in hours and minutes",
                explanation: {
                    steps: [
                        "2 h 24 min = 144 minutes (2 × 60 + 24)",
                        "Find 1/4 of 144 min: 144 ÷ 4 = 36 min",
                        "Multiply by 3: 36 × 3 = 108 min",
                        "Convert: 108 min = 1 h 48 min"
                    ],
                    summary: "Convert to minutes (144 min), find 3/4 (108 min), then convert back to hours and minutes."
                }
            },
            {
                fraction: "2/7",
                quantity: "6.3 km",
                answer: "1.8 km",
                acceptedAnswers: ["1.8 km", "1.8km", "1.8", "1.80 km", "1800 m"],
                hint: "Answer in kilometres",
                explanation: {
                    steps: [
                        "Find 1/7 of 6.3 km: 6.3 ÷ 7 = 0.9 km",
                        "Multiply by 2: 0.9 × 2 = 1.8 km"
                    ],
                    summary: "Divide 6.3 by 7 to get one seventh (0.9 km), then multiply by 2 to get 1.8 km."
                }
            },
            {
                fraction: "2/9",
                quantity: "1.8 m",
                answer: "0.4 m",
                acceptedAnswers: ["0.4 m", "0.4m", "0.4", "0.40 m", "40 cm", "40cm"],
                hint: "Answer in metres",
                explanation: {
                    steps: [
                        "Find 1/9 of 1.8 m: 1.8 ÷ 9 = 0.2 m",
                        "Multiply by 2: 0.2 × 2 = 0.4 m"
                    ],
                    summary: "Divide 1.8 by 9 to get one ninth (0.2 m), then multiply by 2 to get 0.4 m."
                }
            },
            {
                fraction: "5/6",
                quantity: "3 lb 6 oz",
                answer: "2 lb 13 oz",
                acceptedAnswers: ["2 lb 13 oz", "2lb 13oz", "2 pounds 13 ounces", "45 oz", "45oz", "2 lb 13 ounces"],
                hint: "Answer in pounds and ounces (16 oz = 1 lb)",
                explanation: {
                    steps: [
                        "3 lb 6 oz = 54 oz (3 × 16 + 6)",
                        "Find 1/6 of 54 oz: 54 ÷ 6 = 9 oz",
                        "Multiply by 5: 9 × 5 = 45 oz",
                        "Convert: 45 oz = 2 lb 13 oz (45 ÷ 16 = 2 remainder 13)"
                    ],
                    summary: "Convert to ounces (54 oz), find 5/6 (45 oz), then convert back to pounds and ounces."
                }
            },
            {
                fraction: "3/10",
                quantity: "5.6 g",
                answer: "1.68 g",
                acceptedAnswers: ["1.68 g", "1.68g", "1.68"],
                hint: "Answer in grams",
                explanation: {
                    steps: [
                        "Find 1/10 of 5.6 g: 5.6 ÷ 10 = 0.56 g",
                        "Multiply by 3: 0.56 × 3 = 1.68 g"
                    ],
                    summary: "Divide 5.6 by 10 to get one tenth (0.56 g), then multiply by 3 to get 1.68 g."
                }
            },
            {
                fraction: "5/7",
                quantity: "2 ft 11 in",
                answer: "2 ft 1 in",
                acceptedAnswers: ["2 ft 1 in", "2ft 1in", "2 feet 1 inch", "25 in", "25in", "25 inches", "2 ft 1 inch"],
                hint: "Answer in feet and inches (12 in = 1 ft)",
                explanation: {
                    steps: [
                        "2 ft 11 in = 35 in (2 × 12 + 11)",
                        "Find 1/7 of 35 in: 35 ÷ 7 = 5 in",
                        "Multiply by 5: 5 × 5 = 25 in",
                        "Convert: 25 in = 2 ft 1 in (25 ÷ 12 = 2 remainder 1)"
                    ],
                    summary: "Convert to inches (35 in), find 5/7 (25 in), then convert back to feet and inches."
                }
            },
            {
                fraction: "2/11",
                quantity: "£3.41",
                answer: "£0.62",
                acceptedAnswers: ["£0.62", "0.62", "£.62", "62p", "62 pence"],
                hint: "Answer in pounds",
                explanation: {
                    steps: [
                        "Find 1/11 of £3.41: £3.41 ÷ 11 = £0.31",
                        "Multiply by 2: £0.31 × 2 = £0.62"
                    ],
                    summary: "Divide £3.41 by 11 to get one eleventh (£0.31), then multiply by 2 to get £0.62."
                }
            },
            {
                fraction: "2/9",
                quantity: "4.32 kg",
                answer: "0.96 kg",
                acceptedAnswers: ["0.96 kg", "0.96kg", "0.96", "960 g", "960g"],
                hint: "Answer in kilograms",
                explanation: {
                    steps: [
                        "Find 1/9 of 4.32 kg: 4.32 ÷ 9 = 0.48 kg",
                        "Multiply by 2: 0.48 × 2 = 0.96 kg"
                    ],
                    summary: "Divide 4.32 by 9 to get one ninth (0.48 kg), then multiply by 2 to get 0.96 kg."
                }
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let attempted = 0;

        function init() {
            document.getElementById('totalQ').textContent = questions.length;
            loadQuestion();
            document.getElementById('answer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const submitBtn = document.getElementById('submitBtn');
                    const nextBtn = document.getElementById('nextBtn');
                    if (submitBtn.style.display !== 'none') {
                        checkAnswer();
                    } else if (nextBtn.style.display !== 'none') {
                        nextQuestion();
                    }
                }
            });
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('questionText').innerHTML = 
                `<span class="fraction">(${q.fraction})</span> of <span class="quantity">(${q.quantity})</span>`;
            document.getElementById('hintText').textContent = q.hint;
            document.getElementById('answer').value = '';
            document.getElementById('answer').focus();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'block';
            updateProgress();
        }

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const isCorrect = q.acceptedAnswers.some(ans => 
                userAnswer === ans.toLowerCase()
            );

            attempted++;
            document.getElementById('attempted').textContent = attempted;

            const feedback = document.getElementById('feedback');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const correctAnswer = document.getElementById('correctAnswer');
            const explanation = document.getElementById('explanation');

            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;
                feedback.className = 'feedback correct';
                feedbackIcon.textContent = '🎉';
                feedbackTitle.textContent = 'Excellent! Correct!';
                document.getElementById('questionCard').classList.add('bounce');
            } else {
                feedback.className = 'feedback incorrect';
                feedbackIcon.textContent = '💡';
                feedbackTitle.textContent = 'Not quite right';
                document.getElementById('questionCard').classList.add('shake');
            }

            setTimeout(() => {
                document.getElementById('questionCard').classList.remove('bounce', 'shake');
            }, 500);

            correctAnswer.innerHTML = `The correct answer is: <strong>${q.answer}</strong>`;

            let stepsHtml = '<h4>📝 Step-by-step solution:</h4>';
            q.explanation.steps.forEach((step, index) => {
                stepsHtml += `<div class="step">${index + 1}. ${step}</div>`;
            });
            stepsHtml += `<p><strong>💡 Key insight:</strong> ${q.explanation.summary}</p>`;
            explanation.innerHTML = stepsHtml;

            feedback.style.display = 'block';
            document.getElementById('submitBtn').style.display = 'none';

            if (currentQuestion >= questions.length - 1) {
                document.getElementById('nextBtn').textContent = 'See Results 🏆';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showCompletion();
            } else {
                loadQuestion();
            }
        }

        function showCompletion() {
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('completionScreen').style.display = 'block';

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('finalScore').textContent = `${score}/${questions.length}`;

            let message = '';
            if (percentage === 100) {
                message = '🌟 Perfect score! You\'re a fractions master!';
            } else if (percentage >= 80) {
                message = '👏 Great job! You have a strong understanding of fractions!';
            } else if (percentage >= 60) {
                message = '👍 Good effort! Keep practicing to improve!';
            } else if (percentage >= 40) {
                message = '📚 You\'re getting there! Review the steps and try again!';
            } else {
                message = '💪 Don\'t give up! Practice makes perfect!';
            }
            document.getElementById('completionMessage').textContent = message;

            updateProgress();
            document.getElementById('progressBar').style.width = '100%';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            attempted = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('attempted').textContent = '0';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('completionScreen').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Next Question →';
            loadQuestion();
        }

        init();
    </script>
</body>
</html>
