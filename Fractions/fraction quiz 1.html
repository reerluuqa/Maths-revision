
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Math Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            height: 12px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .question-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.25rem;
            color: #2d3748;
            line-height: 1.6;
        }

        .input-section {
            margin-top: 25px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 120px;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-next {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(56, 239, 125, 0.4);
        }

        .feedback {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            display: none;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-left: 5px solid #28a745;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border-left: 5px solid #dc3545;
        }

        .feedback-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feedback-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .feedback.correct .feedback-title {
            color: #155724;
        }

        .feedback.incorrect .feedback-title {
            color: #721c24;
        }

        .correct-answer {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: 600;
            color: #2d3748;
        }

        .explanation {
            color: #4a5568;
            line-height: 1.8;
            font-size: 1rem;
        }

        .explanation strong {
            color: #2d3748;
        }

        .step {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .completion-screen {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .completion-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .btn-restart {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        }

        .hint {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 10px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .content {
                padding: 25px;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧮 Fraction Math Quiz</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">Question 1 of 10</div>
        </div>

        <div class="content" id="quizContent">
            <div class="question-card">
                <span class="question-number" id="questionNumber">Question 1</span>
                <p class="question-text" id="questionText"></p>
            </div>

            <div class="input-section">
                <label id="inputLabel">Your Answer:</label>
                <div class="input-group" id="inputGroup"></div>
                <p class="hint" id="hint"></p>
            </div>

            <button class="btn btn-primary" id="submitBtn" onclick="checkAnswer()">Submit Answer</button>
            <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()" style="display: none;">Next Question →</button>

            <div class="feedback" id="feedback">
                <div class="feedback-icon" id="feedbackIcon"></div>
                <div class="feedback-title" id="feedbackTitle"></div>
                <div class="correct-answer" id="correctAnswer"></div>
                <div class="explanation" id="explanation"></div>
            </div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <div class="completion-icon">🎉</div>
            <h2 class="completion-title">Quiz Complete!</h2>
            <div class="score-display" id="finalScore"></div>
            <p style="color: #4a5568; margin-bottom: 30px;">Great job working through these fraction problems!</p>
            <button class="btn btn-restart" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                text: "A gardener planted 288 cabbage plants and 36 of them died. What fraction of the original number survived?",
                type: "fraction",
                answer: { numerator: 7, denominator: 8 },
                alternateAnswers: [{ numerator: 252, denominator: 288 }],
                hint: "Enter your answer as a fraction (numerator and denominator)",
                explanation: `<div class="step"><strong>Step 1:</strong> Find surviving plants: 288 - 36 = 252 plants survived</div>
                <div class="step"><strong>Step 2:</strong> Write as fraction: 252/288</div>
                <div class="step"><strong>Step 3:</strong> Simplify by finding GCD: Both divide by 36</div>
                <div class="step"><strong>Step 4:</strong> 252 ÷ 36 = 7 and 288 ÷ 36 = 8</div>
                <div class="step"><strong>Answer:</strong> 7/8 of the original plants survived</div>`
            },
            {
                text: "There are 572 pupils in a mixed school, and 5/11 of them are boys. How many girls are there?",
                type: "number",
                answer: 312,
                hint: "Enter a whole number",
                explanation: `<div class="step"><strong>Step 1:</strong> If 5/11 are boys, then girls = 1 - 5/11 = 6/11</div>
                <div class="step"><strong>Step 2:</strong> Calculate girls: 6/11 × 572</div>
                <div class="step"><strong>Step 3:</strong> 572 ÷ 11 = 52, then 52 × 6 = 312</div>
                <div class="step"><strong>Answer:</strong> There are 312 girls in the school</div>`
            },
            {
                text: "When I have read 11/15 of a book of 405 pages, how many pages have I still to read?",
                type: "number",
                answer: 108,
                hint: "Enter a whole number",
                explanation: `<div class="step"><strong>Step 1:</strong> Pages read = 11/15 × 405</div>
                <div class="step"><strong>Step 2:</strong> 405 ÷ 15 = 27, then 27 × 11 = 297 pages read</div>
                <div class="step"><strong>Step 3:</strong> Pages remaining = 405 - 297 = 108</div>
                <div class="step"><strong>Alternative:</strong> Remaining fraction = 4/15, so 4/15 × 405 = 108</div>
                <div class="step"><strong>Answer:</strong> 108 pages still to read</div>`
            },
            {
                text: "If a book contains 405 pages and I have read 315 of them, what fraction of the book have I still to read?",
                type: "fraction",
                answer: { numerator: 2, denominator: 9 },
                alternateAnswers: [{ numerator: 90, denominator: 405 }],
                hint: "Enter your answer as a simplified fraction",
                explanation: `<div class="step"><strong>Step 1:</strong> Pages remaining = 405 - 315 = 90 pages</div>
                <div class="step"><strong>Step 2:</strong> Fraction remaining = 90/405</div>
                <div class="step"><strong>Step 3:</strong> Find GCD of 90 and 405: GCD = 45</div>
                <div class="step"><strong>Step 4:</strong> 90 ÷ 45 = 2 and 405 ÷ 45 = 9</div>
                <div class="step"><strong>Answer:</strong> 2/9 of the book is still to read</div>`
            },
            {
                text: "In a mixed school of 486 pupils there are 270 girls. What fraction of the whole school is boys?",
                type: "fraction",
                answer: { numerator: 4, denominator: 9 },
                alternateAnswers: [{ numerator: 216, denominator: 486 }],
                hint: "Enter your answer as a simplified fraction",
                explanation: `<div class="step"><strong>Step 1:</strong> Number of boys = 486 - 270 = 216</div>
                <div class="step"><strong>Step 2:</strong> Fraction of boys = 216/486</div>
                <div class="step"><strong>Step 3:</strong> Find GCD: Both divisible by 54</div>
                <div class="step"><strong>Step 4:</strong> 216 ÷ 54 = 4 and 486 ÷ 54 = 9</div>
                <div class="step"><strong>Answer:</strong> 4/9 of the school is boys</div>`
            },
            {
                text: "How much less than 6 is the sum of 2¾ and 2⅘?",
                type: "fraction",
                answer: { numerator: 9, denominator: 20 },
                alternateAnswers: [],
                hint: "Enter your answer as a fraction",
                explanation: `<div class="step"><strong>Step 1:</strong> Convert to improper fractions: 2¾ = 11/4 and 2⅘ = 14/5</div>
                <div class="step"><strong>Step 2:</strong> Find common denominator (20): 11/4 = 55/20 and 14/5 = 56/20</div>
                <div class="step"><strong>Step 3:</strong> Add: 55/20 + 56/20 = 111/20</div>
                <div class="step"><strong>Step 4:</strong> Convert 6 to twentieths: 6 = 120/20</div>
                <div class="step"><strong>Step 5:</strong> Subtract: 120/20 - 111/20 = 9/20</div>
                <div class="step"><strong>Answer:</strong> The sum is 9/20 less than 6</div>`
            },
            {
                text: "What must be added to the sum of 1 7/12 and 3 5/8 to make 6 1/12?",
                type: "fraction",
                answer: { numerator: 5, denominator: 6 },
                alternateAnswers: [{ numerator: 20, denominator: 24 }],
                hint: "Enter your answer as a simplified fraction",
                explanation: `<div class="step"><strong>Step 1:</strong> Convert to improper fractions: 1 7/12 = 19/12 and 3 5/8 = 29/8</div>
                <div class="step"><strong>Step 2:</strong> Find LCD (24): 19/12 = 38/24 and 29/8 = 87/24</div>
                <div class="step"><strong>Step 3:</strong> Add: 38/24 + 87/24 = 125/24</div>
                <div class="step"><strong>Step 4:</strong> Convert 6 1/12 = 73/12 = 146/24</div>
                <div class="step"><strong>Step 5:</strong> Subtract: 146/24 - 125/24 = 21/24 = 20/24 = 5/6</div>
                <div class="step"><strong>Answer:</strong> 5/6 must be added</div>`
            },
            {
                text: "A notebook has 128 pages, and 88 of them have been used. What fraction of the notebook remains?",
                type: "fraction",
                answer: { numerator: 5, denominator: 16 },
                alternateAnswers: [{ numerator: 40, denominator: 128 }],
                hint: "Enter your answer as a simplified fraction",
                explanation: `<div class="step"><strong>Step 1:</strong> Pages remaining = 128 - 88 = 40 pages</div>
                <div class="step"><strong>Step 2:</strong> Fraction remaining = 40/128</div>
                <div class="step"><strong>Step 3:</strong> Find GCD: Both divisible by 8</div>
                <div class="step"><strong>Step 4:</strong> 40 ÷ 8 = 5 and 128 ÷ 8 = 16</div>
                <div class="step"><strong>Answer:</strong> 5/16 of the notebook remains</div>`
            },
            {
                text: "A girl spends 1/4 of her weekly pocket-money on Monday, 5/24 on Wednesday and 1/8 on Thursday. What fraction of her money is left?",
                type: "fraction",
                answer: { numerator: 3, denominator: 8 },
                alternateAnswers: [{ numerator: 9, denominator: 24 }],
                hint: "Enter your answer as a simplified fraction",
                explanation: `<div class="step"><strong>Step 1:</strong> Find LCD for 4, 24, and 8: LCD = 24</div>
                <div class="step"><strong>Step 2:</strong> Convert: 1/4 = 6/24, 5/24 = 5/24, 1/8 = 3/24</div>
                <div class="step"><strong>Step 3:</strong> Total spent: 6/24 + 5/24 + 3/24 = 14/24 + 1/24 = 15/24</div>
                <div class="step"><strong>Step 4:</strong> Remaining: 24/24 - 15/24 = 9/24</div>
                <div class="step"><strong>Step 5:</strong> Simplify: 9/24 = 3/8</div>
                <div class="step"><strong>Answer:</strong> 3/8 of her money is left</div>`
            },
            {
                text: "A fruit grower uses 1/3 of his land for apples, 3/8 for plums, 1/4 for pears and the remaining 23 acres for cherries. Find the total area of the land.",
                type: "number",
                answer: 552,
                hint: "Enter a whole number (in acres)",
                explanation: `<div class="step"><strong>Step 1:</strong> Find LCD for 3, 8, and 4: LCD = 24</div>
                <div class="step"><strong>Step 2:</strong> Convert: 1/3 = 8/24, 3/8 = 9/24, 1/4 = 6/24</div>
                <div class="step"><strong>Step 3:</strong> Total used: 8/24 + 9/24 + 6/24 = 23/24</div>
                <div class="step"><strong>Step 4:</strong> Cherries fraction: 1 - 23/24 = 1/24</div>
                <div class="step"><strong>Step 5:</strong> If 1/24 = 23 acres, then total = 23 × 24 = 552 acres</div>
                <div class="step"><strong>Answer:</strong> The total area is 552 acres</div>`
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function initQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('completionScreen').style.display = 'none';
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1}`;
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('hint').textContent = q.hint;
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('progressBar').style.width = `${((currentQuestion) / questions.length) * 100}%`;

            const inputGroup = document.getElementById('inputGroup');
            if (q.type === 'fraction') {
                inputGroup.innerHTML = `
                    <input type="number" id="numerator" placeholder="Numerator (top)" />
                    <input type="number" id="denominator" placeholder="Denominator (bottom)" />
                `;
            } else {
                inputGroup.innerHTML = `
                    <input type="number" id="answer" placeholder="Your answer" />
                `;
            }

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('submitBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function checkAnswer() {
            const q = questions[currentQuestion];
            let isCorrect = false;
            let userAnswer = '';

            if (q.type === 'fraction') {
                const num = parseInt(document.getElementById('numerator').value);
                const den = parseInt(document.getElementById('denominator').value);
                userAnswer = `${num}/${den}`;

                if (!isNaN(num) && !isNaN(den) && den !== 0) {
                    // Check main answer
                    if (num * q.answer.denominator === den * q.answer.numerator) {
                        isCorrect = true;
                    }
                    // Check alternate answers
                    if (!isCorrect && q.alternateAnswers) {
                        for (let alt of q.alternateAnswers) {
                            if (num * alt.denominator === den * alt.numerator) {
                                isCorrect = true;
                                break;
                            }
                        }
                    }
                }
            } else {
                const answer = parseInt(document.getElementById('answer').value);
                userAnswer = answer.toString();
                isCorrect = (answer === q.answer);
            }

            showFeedback(isCorrect, q, userAnswer);
        }

        function showFeedback(isCorrect, q, userAnswer) {
            const feedback = document.getElementById('feedback');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const correctAnswer = document.getElementById('correctAnswer');
            const explanation = document.getElementById('explanation');

            feedback.style.display = 'block';
            
            if (isCorrect) {
                score++;
                feedback.className = 'feedback correct';
                feedbackIcon.textContent = '✅';
                feedbackTitle.textContent = 'Excellent! Correct Answer!';
            } else {
                feedback.className = 'feedback incorrect';
                feedbackIcon.textContent = '❌';
                feedbackTitle.textContent = 'Not quite right. Let\'s learn from this!';
            }

            if (q.type === 'fraction') {
                correctAnswer.innerHTML = `<strong>Correct Answer:</strong> ${q.answer.numerator}/${q.answer.denominator}`;
            } else {
                correctAnswer.innerHTML = `<strong>Correct Answer:</strong> ${q.answer}`;
            }
            
            if (!isCorrect) {
                correctAnswer.innerHTML += `<br><strong>Your Answer:</strong> ${userAnswer || 'No answer provided'}`;
            }

            explanation.innerHTML = `<strong>Solution Explanation:</strong><br>${q.explanation}`;

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').textContent = currentQuestion < questions.length - 1 ? 'Next Question →' : 'See Results →';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showCompletion();
            }
        }

        function showCompletion() {
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('completionScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = 'Completed!';
        }

        function restartQuiz() {
            initQuiz();
        }

        // Initialize quiz on page load
        window.onload = initQuiz;
    </script>
</body>
</html>
