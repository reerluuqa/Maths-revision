<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Simplifier Quiz</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --success-bg: #d1fae5;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .progress-bar {
            height: 6px;
            background-color: rgba(255,255,255,0.3);
            margin-top: 10px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #fff;
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fraction Styling */
        .fraction-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
        }

        .numerator, .denominator {
            padding: 5px;
            text-align: center;
        }

        .bar {
            width: 100%;
            height: 3px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        .equals {
            font-size: 2rem;
            color: var(--text-light);
        }

        /* Input Styling */
        input[type="text"], input[type="number"] {
            width: 60px;
            padding: 8px;
            text-align: center;
            font-size: 1.2rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary);
        }

        /* Feedback Section */
        .feedback-area {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            padding: 15px;
            display: none; /* Hidden by default */
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
        }

        .feedback-area.correct {
            display: block;
            background-color: var(--success-bg);
            color: #065f46;
            border: 1px solid var(--success);
        }

        .feedback-area.incorrect {
            display: block;
            background-color: var(--error-bg);
            color: #991b1b;
            border: 1px solid var(--error);
        }

        .answer-reveal {
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .explanation {
            margin-top: 8px;
            font-style: italic;
            color: var(--text-main);
        }

        /* Buttons */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
            width: 100%;
            font-weight: 600;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--text-main);
            display: none; /* Hidden initially */
        }
        
        .btn-secondary:hover {
            background-color: #000;
        }

        /* End Screen */
        .end-screen {
            display: none;
            text-align: center;
        }
        
        .score-circle {
            width: 100px;
            height: 100px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simplify the Fraction</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </header>

    <div class="content" id="quizContent">
        <div class="fraction-group">
            <!-- Problem Display -->
            <div class="fraction">
                <span class="numerator" id="probNum">15</span>
                <span class="bar"></span>
                <span class="denominator" id="probDen">20</span>
            </div>
            
            <span class="equals">=</span>
            
            <!-- User Input -->
            <div class="fraction">
                <input type="text" id="userNum" placeholder="?" autocomplete="off">
                <span class="bar"></span>
                <input type="text" id="userDen" placeholder="?" autocomplete="off">
            </div>
        </div>

        <button class="btn" id="submitBtn">Check Answer</button>

        <div id="feedback" class="feedback-area">
            <!-- Content injected via JS -->
        </div>

        <button class="btn btn-secondary" id="nextBtn">Next Question</button>
    </div>

    <!-- End Screen -->
    <div class="content end-screen" id="endScreen">
        <div class="score-circle" id="finalScore"></div>
        <h2>Great job!</h2>
        <p>You have completed all the practice problems.</p>
        <button class="btn" onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
    // Data Set
    const problems = [
        { qN: "15", qD: "20", aN: "3", aD: "4", exp: "Divide both top and bottom by their greatest common divisor (GCD), which is 5." },
        { qN: "7", qD: "35", aN: "1", aD: "5", exp: "Both numbers are divisible by 7." },
        { qN: "6", qD: "18", aN: "1", aD: "3", exp: "Divide both numbers by 6." },
        { qN: "30", qD: "80", aN: "3", aD: "8", exp: "Divide both by 10 (remove the zeros)." },
        { qN: "3a", qD: "8a", aN: "3", aD: "8", exp: "The variable 'a' appears on top and bottom, so it cancels out." },
        { qN: "14", qD: "21", aN: "2", aD: "3", exp: "The greatest common divisor of 14 and 21 is 7." },
        { qN: "24", qD: "32", aN: "3", aD: "4", exp: "Divide both numbers by 8." },
        { qN: "5m", qD: "7m", aN: "5", aD: "7", exp: "Cancel out the variable 'm' from the numerator and denominator." },
        { qN: "15", qD: "25", aN: "3", aD: "5", exp: "Both numbers are multiples of 5." },
        { qN: "16", qD: "24", aN: "2", aD: "3", exp: "Divide both numbers by 8." },
        { qN: "15", qD: "45", aN: "1", aD: "3", exp: "15 goes into 45 exactly 3 times." },
        { qN: "2x", qD: "10x", aN: "1", aD: "5", exp: "Cancel 'x' and divide 2 and 10 by 2." },
        { qN: "12a", qD: "16a", aN: "3", aD: "4", exp: "Cancel 'a' and divide 12 and 16 by 4." }
    ];

    let currentIdx = 0;
    let score = 0;

    // DOM Elements
    const probNumEl = document.getElementById('probNum');
    const probDenEl = document.getElementById('probDen');
    const userNumEl = document.getElementById('userNum');
    const userDenEl = document.getElementById('userDen');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackEl = document.getElementById('feedback');
    const progressFill = document.getElementById('progressFill');
    const quizContent = document.getElementById('quizContent');
    const endScreen = document.getElementById('endScreen');
    const finalScoreEl = document.getElementById('finalScore');

    // Initialize
    function loadQuestion() {
        const p = problems[currentIdx];
        
        // Update UI Text
        probNumEl.textContent = p.qN;
        probDenEl.textContent = p.qD;
        
        // Reset Inputs
        userNumEl.value = '';
        userDenEl.value = '';
        userNumEl.disabled = false;
        userDenEl.disabled = false;
        userNumEl.focus();

        // Reset Buttons & Feedback
        submitBtn.style.display = 'block';
        nextBtn.style.display = 'none';
        feedbackEl.className = 'feedback-area'; 
        feedbackEl.innerHTML = '';

        // Update Progress
        const pct = (currentIdx / problems.length) * 100;
        progressFill.style.width = `${pct}%`;
    }

    function checkAnswer() {
        const p = problems[currentIdx];
        const uNum = userNumEl.value.trim();
        const uDen = userDenEl.value.trim();

        if (!uNum || !uDen) {
            alert("Please fill in both boxes.");
            return;
        }

        // Disable inputs
        userNumEl.disabled = true;
        userDenEl.disabled = true;
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'block';

        // Check logic
        const isCorrect = (uNum == p.aN && uDen == p.aD);

        if (isCorrect) {
            score++;
            feedbackEl.classList.add('correct');
            feedbackEl.innerHTML = `
                <strong>Correct!</strong>
                <div class="explanation">${p.exp}</div>
            `;
        } else {
            feedbackEl.classList.add('incorrect');
            feedbackEl.innerHTML = `
                <strong>Not quite.</strong>
                <div class="answer-reveal">Answer: ${p.aN} / ${p.aD}</div>
                <div class="explanation">${p.exp}</div>
            `;
        }
        
        nextBtn.focus();
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < problems.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        quizContent.style.display = 'none';
        endScreen.style.display = 'block';
        finalScoreEl.textContent = `${score}/${problems.length}`;
        progressFill.style.width = '100%';
    }

    // Event Listeners
    submitBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', nextQuestion);

    // Allow Enter key to submit
    const handleEnter = (e) => {
        if (e.key === 'Enter') {
            if (submitBtn.style.display !== 'none') {
                checkAnswer();
            } else if (nextBtn.style.display !== 'none') {
                nextQuestion();
            }
        }
    };
    userNumEl.addEventListener('keypress', handleEnter);
    userDenEl.addEventListener('keypress', handleEnter);

    // Start
    loadQuestion();

</script>

</body>
</html>
