<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Times Table Practice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        h1 { margin-top: 0; font-size: 1.5rem; color: #333; }
        
        .counter {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        #question {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }

        input[type="number"] {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        button {
            width: 80%;
            padding: 10px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #check-btn { background-color: #3498db; color: white; margin-bottom: 5px;}
        #check-btn:hover { background-color: #2980b9; }

        #next-btn { 
            background-color: #27ae60; 
            color: white; 
            display: none; /* Hidden by default */
        }
        #next-btn:hover { background-color: #219150; }

        .feedback {
            height: 30px;
            margin-top: 15px;
            font-weight: bold;
        }
        
        .correct { color: green; }
        .wrong { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h1>10 Times Table</h1>
    
    <div class="counter">Correct: <span id="score">0</span></div>

    <div id="question">Loading...</div>
    
    <input type="number" id="answer-input" placeholder="?">
    
    <button id="check-btn">CHECK</button>
    <button id="next-btn">NEXT</button>

    <div id="feedback" class="feedback"></div>
</div>

<script>
    // State variables
    let currentNumber;
    let correctScore = 0;
    
    // DOM Elements
    const questionEl = document.getElementById('question');
    const inputEl = document.getElementById('answer-input');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');

    // Initialize first question
    generateQuestion();

    function generateQuestion() {
        // Random number between 1 and 12
        currentNumber = Math.floor(Math.random() * 12) + 1;
        
        // Update display (e.g., "10 x 5 = ?")
        questionEl.textContent = `10 × ${currentNumber} = ?`;
        
        // Reset input and feedback
        inputEl.value = '';
        inputEl.focus();
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback'; // Remove color classes
        
        // Hide next button, show check button
        nextBtn.style.display = 'none';
    }

    function checkAnswer() {
        const userAnswer = parseInt(inputEl.value);
        
        if (isNaN(userAnswer)) return; // Do nothing if empty

        if (userAnswer === currentNumber * 10) {
            // Correct
            correctScore++;
            scoreEl.textContent = correctScore;
            
            feedbackEl.textContent = "Correct!";
            feedbackEl.classList.add('correct');
            
            // Enable Next button, disable Check button visually (optional UX choice, but prompt implies distinct flow)
            nextBtn.style.display = 'inline-block';
        } else {
            // Incorrect
            feedbackEl.textContent = "Try again";
            feedbackEl.classList.add('wrong');
        }
    }

    checkBtn.addEventListener('click', checkAnswer);
    
    nextBtn.addEventListener('click', generateQuestion);
</script>

</body>
</html>
