<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9 Times Table Practice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        h1 { margin-top: 0; color: #333; font-size: 1.5rem; }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #666;
        }

        .question-box {
            font-size: 3rem;
            margin: 10px 0;
            color: #2c3e50;
        }

        input[type="number"] {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #checkBtn { background-color: #3498db; color: white; }
        #checkBtn:hover { background-color: #2980b9; }
        
        #nextBtn { 
            background-color: #27ae60; 
            color: white; 
            display: none; /* Hidden by default */
        }
        #nextBtn:hover { background-color: #1e8449; }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        
        .correct { color: green; }
        .incorrect { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h1>9 Times Table</h1>
    
    <div class="stats">
        <span id="scoreCorrect">Correct: 0</span>
        <span id="scoreIncorrect">Wrong: 0</span>
    </div>

    <div class="question-box" id="questionDisplay">9 x ? = ?</div>
    
    <input type="number" id="answerInput" placeholder="?">
    
    <div class="buttons">
        <button id="checkBtn">CHECK</button>
        <button id="nextBtn">NEXT</button>
    </div>

    <p class="feedback" id="feedback"></p>
</div>

<script>
    // State variables
    let currentNumber = 0;
    let correctCount = 0;
    let incorrectCount = 0;

    // DOM Elements
    const questionDisplay = document.getElementById('questionDisplay');
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackEl = document.getElementById('feedback');
    const scoreCorrectEl = document.getElementById('scoreCorrect');
    const scoreIncorrectEl = document.getElementById('scoreIncorrect');

    // Initialize the first question on load
    generateQuestion();

    function generateQuestion() {
        // Generate random number between 1 and 12
        currentNumber = Math.floor(Math.random() * 12) + 1;
        
        // Update UI
        questionDisplay.textContent = `9 x ${currentNumber} = ?`;
        answerInput.value = '';
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        
        // Reset buttons state
        checkBtn.disabled = false;
        nextBtn.style.display = 'none';
        answerInput.focus();
    }

    function checkAnswer() {
        const userAnswer = parseInt(answerInput.value);
        
        if (isNaN(userAnswer)) return; // Do nothing if empty

        const correctAnswer = 9 * currentNumber;

        if (userAnswer === correctAnswer) {
            feedbackEl.textContent = "Correct!";
            feedbackEl.classList.add('correct');
            
            correctCount++;
            scoreCorrectEl.textContent = `Correct: ${correctCount}`;
            
            // Enable Next button, disable Check button to prevent spamming
            checkBtn.disabled = true;
            nextBtn.style.display = 'inline-block';
        } else {
            feedbackEl.textContent = "Try again";
            feedbackEl.classList.add('incorrect');
            
            incorrectCount++;
            scoreIncorrectEl.textContent = `Wrong: ${incorrectCount}`;
        }

        // Clear input for the next attempt regardless of result
        answerInput.value = '';
    }

    checkBtn.addEventListener('click', checkAnswer);
    
    nextBtn.addEventListener('click', generateQuestion);
</script>

</body>
</html>
