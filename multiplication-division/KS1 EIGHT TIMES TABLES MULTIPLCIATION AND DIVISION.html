<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8️⃣ Math Pals – Inverse Ops (Year 2)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f9e6b3 0%, #ffcf8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            padding: 16px;
            margin: 0;
        }

        .app-container {
            max-width: 750px;
            width: 100%;
            background-color: #fffef7;
            border-radius: 70px 70px 40px 40px;
            box-shadow: 0 20px 0 #b38b5e, 0 25px 25px rgba(0, 0, 0, 0.2);
            padding: 30px 25px 35px 25px;
            border: 5px solid #fbbb2d;
        }

        .math-header {
            background-color: #4caf9e;
            border-radius: 60px 60px 30px 30px;
            padding: 16px 25px;
            margin-bottom: 25px;
            color: white;
            text-shadow: 3px 3px 0 #1d6d5e;
            box-shadow: inset 0 -5px 0 #1d6d5e, 0 8px 0 #247a68;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .math-header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-badge {
            background-color: #ffdd77;
            color: #3a2c0f;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 50px;
            border: 3px solid #ffb347;
            box-shadow: inset 0 -3px 0 #b17f2e;
        }

        .question-card {
            background: #fef6d8;
            border-radius: 50px;
            padding: 25px 15px 15px 15px;
            border: 5px solid #ffb554;
            box-shadow: inset 0 -5px 0 #e09e3a, 0 12px 0 #b87333;
            margin-bottom: 30px;
        }

        .big-equation {
            font-size: 6rem;
            text-align: center;
            line-height: 1.2;
            font-weight: 800;
            color: #2d4b7c;
            text-shadow: 5px 5px 0 #b3d0ff;
            word-break: break-word;
        }

        .inverse-hint-area {
            background-color: #c3e6f4;
            border-radius: 40px;
            padding: 18px 15px;
            margin: 15px 0 5px 0;
            border: 4px dashed #3f8da8;
            font-size: 2rem;
            text-align: center;
            color: #1b4b5e;
            box-shadow: inset 0 -3px 0 #6fa6b9;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inverse-text {
            background: #fefbda;
            padding: 10px 25px;
            border-radius: 60px;
            display: inline-block;
            border: 3px solid #fcaa48;
        }

        .answer-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin: 10px 0 20px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .answer-input {
            font-size: 3.5rem;
            width: 200px;
            text-align: center;
            border: 6px solid #ff9e5e;
            border-radius: 70px;
            background-color: #fff3c9;
            font-weight: bold;
            color: #2f2f6b;
            padding: 10px 5px;
            box-shadow: inset 0 5px 0 #e6c8a0, 0 8px 0 #b85f1e;
            outline: none;
            font-family: inherit;
        }

        .check-btn {
            background-color: #6ec76e;
            border: none;
            font-size: 2.8rem;
            padding: 15px 35px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 #2a732a;
            box-shadow: 0 8px 0 #2a732a, 0 10px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.08s linear;
            border: 3px solid #bbffb1;
            font-family: inherit;
        }

        .check-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2a732a;
        }

        .feedback-msg {
            font-size: 2.5rem;
            min-height: 4rem;
            padding: 10px 20px;
            background-color: #f1dbb4;
            border-radius: 40px;
            border: 4px solid #f9965b;
            width: fit-content;
            margin: 0 auto 5px;
            font-weight: bold;
        }

        .correct-feedback {
            background-color: #b9f6b9;
            border-color: #16a516;
            color: #165816;
        }

        .incorrect-feedback {
            background-color: #ffc9c9;
            border-color: #dc143c;
            color: #990000;
        }

        .nav-progress-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
            gap: 10px;
        }

        .next-btn {
            background-color: #f7b731;
            border: none;
            font-size: 2.2rem;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            color: #3a2a01;
            box-shadow: 0 7px 0 #b87c1b;
            cursor: pointer;
            transition: 0.08s;
            border: 3px solid #ffe49e;
            font-family: inherit;
            flex: 0 0 auto;
        }

        .next-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #b87c1b;
        }

        .next-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 7px 0 #b87c1b;
            pointer-events: none;
        }

        .mastery-progress {
            background-color: #ffb27a;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 1.7rem;
            font-weight: bold;
            color: #1d3b3b;
            border: 4px solid #f5821f;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .fact-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .fact-pill {
            background: #fef9cf;
            width: 45px;
            height: 45px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            border: 3px solid #d7842c;
            box-shadow: inset 0 -2px 0 #bb6b23;
            transition: 0.1s;
        }

        .fact-pill.mastered {
            background-color: #9edb9e;
            border-color: #1b7e1b;
            color: #003d00;
        }

        .hint-note {
            color: #7f5f30;
            font-size: 1.5rem;
            text-align: center;
            margin-top: 15px;
            background: #ffe8be;
            border-radius: 40px;
            padding: 12px;
            border: 3px solid #fba76f;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="math-header">
        <h1>✨ 8's Unicorn ✨ <span style="font-size: 2rem;">× ÷</span></h1>
        <div class="progress-badge" id="questionCounter">1 / 10</div>
    </div>

    <div class="question-card">
        <div class="big-equation" id="questionDisplay">8 × 5 = ?</div>
        <div class="inverse-hint-area" id="hintDisplay">
            <span class="inverse-text">💡 hint shows inverse</span>
        </div>
    </div>

    <div class="answer-box">
        <div class="input-group">
            <input type="number" id="answerInput" class="answer-input" placeholder="?" value="" inputmode="numeric">
            <button class="check-btn" id="checkBtn">CHECK</button>
        </div>
        <div class="feedback-msg" id="feedbackMsg">⭐ enter answer</div>
    </div>

    <div class="nav-progress-row">
        <button class="next-btn" id="nextBtn" disabled>▶ NEXT FACT</button>
        <div class="mastery-progress">
            <span>✔ mastered:</span>
            <div class="fact-list" id="factProgress"></div>
        </div>
    </div>
    <div class="hint-note">
        ⚡ hint shows inverse relationship (but not the answer!) — full family after correct
    </div>
</div>

<script>
    (function() {
        const BASE = 8;

        // State
        let currentMultiplier = 5;
        let currentType = 'mult';
        let correctAnswerThisQuestion = 40;
        let questionAnsweredCorrect = false;
        let showFullInverse = false;

        // Track mastered facts
        let multCorrect = new Array(10).fill(false);
        let divCorrect = new Array(10).fill(false);

        // DOM elements
        const questionDisplay = document.getElementById('questionDisplay');
        const hintDisplay = document.getElementById('hintDisplay');
        const answerInput = document.getElementById('answerInput');
        const checkBtn = document.getElementById('checkBtn');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const nextBtn = document.getElementById('nextBtn');
        const questionCounter = document.getElementById('questionCounter');
        const factProgress = document.getElementById('factProgress');

        function idxFromMult(m) { 
            return m - 1; 
        }

        function generateRandomQuestion() {
            const randomMult = Math.floor(Math.random() * 10) + 1;
            const typeRand = Math.random() < 0.5 ? 'mult' : 'div';
            setCurrentQuestion(randomMult, typeRand);
        }

        function setCurrentQuestion(mult, type) {
            currentMultiplier = mult;
            currentType = type;
            questionAnsweredCorrect = false;
            showFullInverse = false;

            let equationText = '';
            let answerValue;
            
            if (type === 'mult') {
                answerValue = BASE * mult;
                equationText = `8 × ${mult} = ?`;
            } else {
                const product = BASE * mult;
                equationText = `${product} ÷ ${mult} = ?`;
                answerValue = BASE;
            }
            
            correctAnswerThisQuestion = answerValue;
            questionDisplay.innerText = equationText;

            // Update hint (without revealing answer)
            updateHint();

            answerInput.value = '';
            feedbackMsg.innerText = '✨ type answer ✨';
            feedbackMsg.classList.remove('correct-feedback', 'incorrect-feedback');
            nextBtn.disabled = true;
            updateProgressDisplay();
            answerInput.focus();
        }

        function updateHint() {
            const product = BASE * currentMultiplier;
            
            if (showFullInverse) {
                // After correct answer, show full fact family
                if (currentType === 'mult') {
                    hintDisplay.innerHTML = `<span class="inverse-text">✅ 8 × ${currentMultiplier} = ${product} &nbsp;&nbsp; → &nbsp; ${product} ÷ ${currentMultiplier} = 8 &nbsp;&nbsp; ${product} ÷ 8 = ${currentMultiplier}</span>`;
                } else {
                    hintDisplay.innerHTML = `<span class="inverse-text">✅ ${product} ÷ ${currentMultiplier} = 8 &nbsp;&nbsp; → &nbsp; 8 × ${currentMultiplier} = ${product} &nbsp;&nbsp; ${product} ÷ 8 = ${currentMultiplier}</span>`;
                }
                return;
            }

            // Hint WITHOUT revealing the current answer
            if (currentType === 'mult') {
                // For multiplication: show the inverse division but hide the product (which is the answer)
                // Use a question mark for the product
                hintDisplay.innerHTML = `<span class="inverse-text">🔎 8 × ${currentMultiplier} = ? &nbsp;&nbsp; → &nbsp; ? ÷ ${currentMultiplier} = 8</span>`;
            } else {
                // For division: show the inverse multiplication but hide the quotient (which is the answer)
                // The answer to division is always 8, so we hide that
                hintDisplay.innerHTML = `<span class="inverse-text">🔎 ${product} ÷ ${currentMultiplier} = ? &nbsp;&nbsp; → &nbsp; 8 × ${currentMultiplier} = ${product}</span>`;
            }
        }

        function handleCheck() {
            if (questionAnsweredCorrect) {
                feedbackMsg.innerText = '✔ Already correct! Click NEXT.';
                return;
            }

            const inputVal = answerInput.value.trim();
            if (inputVal === '') {
                feedbackMsg.innerText = '📝 Type a number!';
                return;
            }
            
            const num = Number(inputVal);
            if (isNaN(num)) {
                feedbackMsg.innerText = '🔢 Numbers only please!';
                return;
            }

            const isCorrect = (num === correctAnswerThisQuestion);
            
            if (isCorrect) {
                const idx = idxFromMult(currentMultiplier);
                if (currentType === 'mult') {
                    multCorrect[idx] = true;
                } else {
                    divCorrect[idx] = true;
                }

                questionAnsweredCorrect = true;
                showFullInverse = true;
                
                feedbackMsg.innerText = '✅ CORRECT! 🎉';
                feedbackMsg.classList.add('correct-feedback');
                feedbackMsg.classList.remove('incorrect-feedback');

                nextBtn.disabled = false;
                updateHint();
                updateProgressDisplay();
            } else {
                feedbackMsg.innerText = '❌ Oops, try again!';
                feedbackMsg.classList.add('incorrect-feedback');
                feedbackMsg.classList.remove('correct-feedback');
                answerInput.focus();
            }
        }

        function handleNext() {
            if (!questionAnsweredCorrect) return;
            generateRandomQuestion();
        }

        function updateProgressDisplay() {
            let pillsHtml = '';
            for (let m = 1; m <= 10; m++) {
                const idx = idxFromMult(m);
                const masteredBoth = multCorrect[idx] && divCorrect[idx];
                const pillClass = masteredBoth ? 'fact-pill mastered' : 'fact-pill';
                pillsHtml += `<div class="${pillClass}">${m}</div>`;
            }
            factProgress.innerHTML = pillsHtml;
            questionCounter.innerText = `${currentMultiplier} / 10`;
        }

        function initApp() {
            generateRandomQuestion();

            checkBtn.addEventListener('click', handleCheck);
            nextBtn.addEventListener('click', handleNext);
            
            answerInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleCheck();
                }
            });
        }

        initApp();
    })();
</script>
</body>
</html>
