<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11 Times Table Adventure - Year 2 Maths</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 5px solid #FFD700;
        }

        h1 {
            text-align: center;
            color: #FF6B6B;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #FFE66D;
        }

        .subtitle {
            text-align: center;
            color: #4ECDC4;
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .progress-container {
            background: #FFE66D;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
            border: 3px solid #FF6B6B;
        }

        .progress-title {
            font-size: 1.2rem;
            color: #4A4A4A;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-bars {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .progress-dot {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: white;
            border: 2px solid #4ECDC4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #4A4A4A;
            transition: all 0.3s ease;
        }

        .progress-dot.completed {
            background: #4ECDC4;
            color: white;
            border-color: #FF6B6B;
            transform: scale(1.1);
        }

        .progress-dot.current {
            border: 4px solid #FF6B6B;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .question-card {
            background: #4ECDC4;
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            margin-bottom: 25px;
            border: 4px solid white;
            box-shadow: 0 10px 0 #2C8B82;
        }

        .question-text {
            font-size: 4rem;
            color: white;
            font-weight: bold;
            text-shadow: 4px 4px 0 #2C8B82;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .hint-box {
            background: #FFE66D;
            border-radius: 30px;
            padding: 20px;
            font-size: 1.8rem;
            color: #4A4A4A;
            border: 3px solid white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .hint-box:hover {
            transform: scale(1.02);
            background: #FFD93D;
        }

        .hint-text {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #FF6B6B;
            font-weight: bold;
        }

        .inverse-relation {
            font-size: 2rem;
            color: #4A4A4A;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            padding: 15px;
            margin-top: 10px;
            border: 2px dashed #FF6B6B;
        }

        .input-area {
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 5px 0 #DDD;
        }

        .answer-input {
            width: 100%;
            padding: 20px;
            font-size: 2rem;
            text-align: center;
            border: 3px solid #4ECDC4;
            border-radius: 50px;
            margin-bottom: 15px;
            font-family: inherit;
            outline: none;
        }

        .answer-input:focus {
            border-color: #FF6B6B;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .button {
            padding: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            color: white;
            border-bottom: 5px solid rgba(0,0,0,0.2);
        }

        .button:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .check-btn {
            background: #4ECDC4;
        }

        .next-btn {
            background: #FF6B6B;
        }

        .hint-btn {
            background: #FFE66D;
            color: #4A4A4A;
            grid-column: span 2;
        }

        .feedback {
            padding: 15px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }

        .feedback.correct {
            background: #B7F9B7;
            color: #0F4C0F;
            border: 3px solid #0F4C0F;
        }

        .feedback.incorrect {
            background: #FFB5B5;
            color: #8B0000;
            border: 3px solid #8B0000;
        }

        .celebration {
            text-align: center;
            font-size: 2rem;
            margin-top: 15px;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 500px) {
            .app-container {
                padding: 15px;
            }
            
            .question-text {
                font-size: 3rem;
            }
            
            .hint-box {
                font-size: 1.3rem;
            }
            
            .button {
                padding: 15px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>✨ 11 Times Table Magic ✨</h1>
        <div class="subtitle">Multiplication & Division are Best Friends!</div>

        <div class="progress-container">
            <div class="progress-title">🌟 Your Progress (1-12) 🌟</div>
            <div class="progress-bars" id="progressBars"></div>
        </div>

        <div class="question-card">
            <div class="question-text" id="questionText">11 × 3 = ?</div>
            <div class="hint-box" id="hintBox" onclick="toggleHint()">
                <div class="hint-text">💡 Need a hint? Click here! 💡</div>
                <div id="hintContent" style="display: none;"></div>
            </div>
            <div id="inverseDisplay" style="display: none;" class="inverse-relation"></div>
        </div>

        <div class="input-area">
            <input type="number" id="answerInput" class="answer-input" placeholder="Type your answer" min="0" max="132">
            
            <div class="button-grid">
                <button class="button check-btn" onclick="checkAnswer()" id="checkBtn">✅ Check</button>
                <button class="button next-btn" onclick="nextQuestion()" id="nextBtn" disabled>➡️ Next</button>
                <button class="button hint-btn" onclick="toggleHint()">🔍 Show/Hide Hint</button>
            </div>

            <div id="feedback" class="feedback"></div>
            <div id="celebration" class="celebration"></div>
        </div>
    </div>

    <script>
        let currentQuestion = {
            type: 'multiplication', // 'multiplication' or 'division'
            multiplicand: 0, // The number being multiplied (11)
            multiplier: 0, // The number we're multiplying by (1-12)
            product: 0, // The result (11 × multiplier)
            answer: 0 // The correct answer to the current question
        };
        
        let progress = new Array(12).fill(false); // Track which numbers (1-12) are completed
        let hintVisible = false;
        let questionAnswered = false;
        let correctAnswerGiven = false;

        // Initialize the app
        function init() {
            generateNewQuestion();
            updateProgressBars();
        }

        // Generate a random question (alternating between multiplication and division)
        function generateNewQuestion() {
            const type = Math.random() < 0.5 ? 'multiplication' : 'division';
            const multiplier = Math.floor(Math.random() * 12) + 1; // 1-12
            const product = 11 * multiplier;

            currentQuestion = {
                type: type,
                multiplicand: 11,
                multiplier: multiplier,
                product: product,
                answer: type === 'multiplication' ? product : multiplier
            };

            updateDisplay();
            hintVisible = false;
            document.getElementById('hintContent').style.display = 'none';
            document.getElementById('inverseDisplay').style.display = 'none';
            questionAnswered = false;
            correctAnswerGiven = false;
            
            // Enable check button, disable next button
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('celebration').innerHTML = '';
            document.getElementById('answerInput').focus();
            
            // Update progress indicator for current question
            updateProgressBars();
        }

        // Update the display with current question
        function updateDisplay() {
            const questionText = document.getElementById('questionText');
            if (currentQuestion.type === 'multiplication') {
                questionText.textContent = `11 × ${currentQuestion.multiplier} = ?`;
            } else {
                questionText.textContent = `${currentQuestion.product} ÷ 11 = ?`;
            }

            // Update hint content (inverse relationship without revealing answer)
            const hintContent = document.getElementById('hintContent');
            if (currentQuestion.type === 'multiplication') {
                hintContent.textContent = `✨ Hint: 11 × ${currentQuestion.multiplier} = ?  →  ? ÷ 11 = ${currentQuestion.multiplier}`;
            } else {
                hintContent.textContent = `✨ Hint: ${currentQuestion.product} ÷ 11 = ?  →  11 × ? = ${currentQuestion.product}`;
            }
        }

        // Toggle hint visibility
        function toggleHint() {
            if (!questionAnswered) {
                const hintContent = document.getElementById('hintContent');
                if (hintVisible) {
                    hintContent.style.display = 'none';
                } else {
                    hintContent.style.display = 'block';
                }
                hintVisible = !hintVisible;
            }
        }

        // Check the user's answer
        function checkAnswer() {
            if (questionAnswered) return;

            const userAnswer = parseInt(document.getElementById('answerInput').value);
            const feedback = document.getElementById('feedback');
            
            if (isNaN(userAnswer)) {
                feedback.innerHTML = '❌ Please enter a number!';
                feedback.className = 'feedback incorrect';
                return;
            }

            const isCorrect = userAnswer === currentQuestion.answer;
            
            if (isCorrect) {
                // Mark this multiplier as completed if not already
                const index = currentQuestion.multiplier - 1;
                if (!progress[index]) {
                    progress[index] = true;
                }
                
                feedback.innerHTML = '✅ Correct! Well done! 🌟';
                feedback.className = 'feedback correct';
                
                // Show the complete inverse relationship
                const inverseDisplay = document.getElementById('inverseDisplay');
                if (currentQuestion.type === 'multiplication') {
                    inverseDisplay.innerHTML = `🎉 11 × ${currentQuestion.multiplier} = ${currentQuestion.product}  ↔  ${currentQuestion.product} ÷ 11 = ${currentQuestion.multiplier}`;
                } else {
                    inverseDisplay.innerHTML = `🎉 ${currentQuestion.product} ÷ 11 = ${currentQuestion.multiplier}  ↔  11 × ${currentQuestion.multiplier} = ${currentQuestion.product}`;
                }
                inverseDisplay.style.display = 'block';
                
                // Show celebration animation
                document.getElementById('celebration').innerHTML = '🎈 ⭐ 🎊';
                
                questionAnswered = true;
                correctAnswerGiven = true;
                
                // Disable check button, enable next button
                document.getElementById('checkBtn').disabled = true;
                document.getElementById('nextBtn').disabled = false;
                
                // Update progress bars
                updateProgressBars();
                
                // Check if all are completed
                if (progress.every(val => val === true)) {
                    setTimeout(() => {
                        document.getElementById('celebration').innerHTML = '🎉 CONGRATULATIONS! You mastered the 11 times table! 🎉';
                    }, 500);
                }
            } else {
                feedback.innerHTML = '❌ Try again! You can do it! 💪';
                feedback.className = 'feedback incorrect';
                
                // Shake animation for incorrect answer
                document.querySelector('.question-card').style.animation = 'shake 0.5s ease';
                setTimeout(() => {
                    document.querySelector('.question-card').style.animation = '';
                }, 500);
            }
        }

        // Move to next question
        function nextQuestion() {
            if (correctAnswerGiven) {
                generateNewQuestion();
            }
        }

        // Update progress bars display
        function updateProgressBars() {
            const progressBars = document.getElementById('progressBars');
            progressBars.innerHTML = '';
            
            for (let i = 1; i <= 12; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (progress[i-1]) {
                    dot.classList.add('completed');
                }
                if (i === currentQuestion.multiplier && !progress[i-1]) {
                    dot.classList.add('current');
                }
                dot.textContent = i;
                progressBars.appendChild(dot);
            }
        }

        // Add shake animation for incorrect answers
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // Allow Enter key to submit answer
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('checkBtn').disabled) {
                checkAnswer();
            }
        });

        // Initialize the app when page loads
        window.onload = init;
    </script>
</body>
</html>
