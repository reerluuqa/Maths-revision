<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Times Table - Inverse Operations Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 60px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 5px solid #ffd966;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: #ff9aa2;
            padding: 20px;
            border-radius: 50px;
            border: 4px solid #fff;
            box-shadow: 0 8px 0 #b95c6b;
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            text-shadow: 3px 3px 0 #b95c6b;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #fff;
            font-size: 1.2rem;
            margin-top: 10px;
            background: #b5e6b5;
            display: inline-block;
            padding: 8px 25px;
            border-radius: 40px;
            border: 3px solid #fff;
        }

        .progress-section {
            background: #b5e6b5;
            padding: 15px;
            border-radius: 40px;
            margin-bottom: 25px;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #6b8e6b;
        }

        .progress-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2d5a2d;
            text-align: center;
            margin-bottom: 10px;
        }

        .progress-bars {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .fact-pill {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 3px solid #6b8e6b;
            transition: all 0.3s ease;
        }

        .fact-pill.completed {
            background: #ffb347;
            border-color: #fff;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 4px 0 #b16f1a;
        }

        .fact-pill.current {
            border: 5px solid #ff6b6b;
            transform: scale(1.15);
            box-shadow: 0 4px 0 #b13e3e;
        }

        .question-box {
            background: #ffd966;
            padding: 40px;
            border-radius: 70px;
            margin-bottom: 25px;
            border: 6px solid #fff;
            box-shadow: 0 12px 0 #b38f40;
        }

        .question {
            font-size: 5rem;
            text-align: center;
            color: #2d3748;
            font-weight: bold;
            letter-spacing: 5px;
            background: white;
            padding: 30px;
            border-radius: 50px;
            border: 4px solid #b38f40;
        }

        .hint-section {
            background: #b2f0ff;
            padding: 20px;
            border-radius: 40px;
            margin: 20px 0;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #5299aa;
        }

        .hint-text {
            font-size: 1.8rem;
            text-align: center;
            color: #0d3b4f;
            font-weight: bold;
        }

        .inverse-text {
            font-size: 2rem;
            text-align: center;
            color: #2c5282;
            margin-top: 15px;
            padding: 15px;
            background: #e9f9ff;
            border-radius: 40px;
            border: 3px solid #fff;
        }

        .input-section {
            display: flex;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .answer-input {
            flex: 2;
            min-width: 200px;
            padding: 20px 30px;
            font-size: 2.5rem;
            text-align: center;
            border: 5px solid #b19cd9;
            border-radius: 60px;
            font-family: inherit;
            background: white;
            outline: none;
        }

        .answer-input:focus {
            border-color: #8b6fc6;
            box-shadow: 0 0 0 4px rgba(139, 111, 198, 0.3);
        }

        .submit-btn {
            flex: 1;
            min-width: 150px;
            padding: 20px 30px;
            font-size: 2rem;
            font-weight: bold;
            background: #9acd32;
            color: white;
            border: none;
            border-radius: 60px;
            border-bottom: 8px solid #6b8e23;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: inherit;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: #8bc34a;
        }

        .submit-btn:active {
            transform: translateY(4px);
            border-bottom-width: 4px;
        }

        .next-btn {
            width: 100%;
            padding: 20px;
            font-size: 2rem;
            font-weight: bold;
            background: #ff9aa2;
            color: white;
            border: none;
            border-radius: 60px;
            border-bottom: 8px solid #b95c6b;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: inherit;
            margin-top: 20px;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #ffb3ba;
        }

        .next-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 4px;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-bottom-width: 8px;
        }

        .feedback {
            text-align: center;
            font-size: 2rem;
            padding: 20px;
            border-radius: 40px;
            margin: 15px 0;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 4px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 4px solid #f5c6cb;
        }

        .emoji-large {
            font-size: 3rem;
            display: block;
        }

        @media (max-width: 600px) {
            .question {
                font-size: 3rem;
            }
            .answer-input {
                font-size: 2rem;
            }
            .hint-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>✨ 5 Times Table Adventure ✨</h1>
            <div class="subtitle">Multiplication & Division Friends!</div>
        </div>

        <div class="progress-section">
            <div class="progress-text">🌟 Your Progress 🌟</div>
            <div class="progress-bars" id="progressBars"></div>
        </div>

        <div class="question-box">
            <div class="question" id="question">5 × 5 = ?</div>
        </div>

        <div class="hint-section">
            <div class="hint-text" id="hint">💡 Click hint to see the inverse!</div>
            <button class="submit-btn" id="hintBtn" style="background: #87ceeb; border-bottom-color: #5f9ea0; margin-top: 15px; font-size: 1.5rem; padding: 15px;">🔍 Show Hint</button>
            <div id="inverseDisplay" class="inverse-text" style="display: none;"></div>
        </div>

        <div class="input-section">
            <input type="number" id="answerInput" class="answer-input" placeholder="?" min="0" max="100">
            <button class="submit-btn" id="submitBtn">Check</button>
        </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" disabled>➡️ Next Question</button>
    </div>

    <script>
        class TimesTableApp {
            constructor() {
                this.currentFact = 1;
                this.currentType = 'multiplication'; // 'multiplication' or 'division'
                this.completedFacts = new Array(10).fill(false);
                this.currentAnswer = 25;
                this.showingInverse = false;
                this.answeredCorrectly = false;
                
                this.initializeElements();
                this.attachEventListeners();
                this.generateNewQuestion();
                this.updateProgressBars();
            }

            initializeElements() {
                this.questionEl = document.getElementById('question');
                this.hintEl = document.getElementById('hint');
                this.inverseDisplay = document.getElementById('inverseDisplay');
                this.answerInput = document.getElementById('answerInput');
                this.submitBtn = document.getElementById('submitBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.feedbackEl = document.getElementById('feedback');
                this.progressBars = document.getElementById('progressBars');
                this.hintBtn = document.getElementById('hintBtn');
            }

            attachEventListeners() {
                this.submitBtn.addEventListener('click', () => this.checkAnswer());
                this.nextBtn.addEventListener('click', () => this.nextQuestion());
                this.hintBtn.addEventListener('click', () => this.showHint());
                this.answerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });
            }

            generateNewQuestion() {
                // Randomly decide between multiplication and division
                this.currentType = Math.random() < 0.5 ? 'multiplication' : 'division';
                
                // Pick a random fact from 1-10 that's not completed, or any if all completed
                const availableFacts = this.completedFacts.map((completed, index) => 
                    !completed ? index + 1 : null
                ).filter(fact => fact !== null);
                
                if (availableFacts.length > 0) {
                    this.currentFact = availableFacts[Math.floor(Math.random() * availableFacts.length)];
                } else {
                    // All facts completed, pick any for practice
                    this.currentFact = Math.floor(Math.random() * 10) + 1;
                }

                // Set the question based on type
                if (this.currentType === 'multiplication') {
                    this.questionEl.textContent = `5 × ${this.currentFact} = ?`;
                    this.currentAnswer = 5 * this.currentFact;
                } else {
                    const product = 5 * this.currentFact;
                    this.questionEl.textContent = `${product} ÷ 5 = ?`;
                    this.currentAnswer = this.currentFact;
                }

                // Reset state for new question
                this.answeredCorrectly = false;
                this.showingInverse = false;
                this.inverseDisplay.style.display = 'none';
                this.inverseDisplay.innerHTML = '';
                this.hintEl.textContent = '💡 Click hint to see the inverse!';
                this.answerInput.value = '';
                this.feedbackEl.innerHTML = '';
                this.feedbackEl.className = 'feedback';
                this.nextBtn.disabled = true;
                this.updateProgressBars();
            }

            showHint() {
                if (this.answeredCorrectly) {
                    // After correct answer, show full inverse
                    this.showFullInverse();
                } else {
                    // Before correct answer, show hint without revealing answer
                    let hintText = '';
                    if (this.currentType === 'multiplication') {
                        hintText = `5 × ${this.currentFact} = ? → ${5 * this.currentFact} ÷ ${this.currentFact} = 5`;
                    } else {
                        hintText = `${5 * this.currentFact} ÷ 5 = ? → 5 × ${this.currentFact} = ${5 * this.currentFact}`;
                    }
                    this.hintEl.textContent = `💡 Hint: ${hintText}`;
                }
            }

            showFullInverse() {
                let inverseText = '';
                if (this.currentType === 'multiplication') {
                    inverseText = `✨ Great! 5 × ${this.currentFact} = ${5 * this.currentFact} and ${5 * this.currentFact} ÷ 5 = ${this.currentFact} ✨`;
                } else {
                    inverseText = `✨ Great! ${5 * this.currentFact} ÷ 5 = ${this.currentFact} and 5 × ${this.currentFact} = ${5 * this.currentFact} ✨`;
                }
                this.inverseDisplay.innerHTML = inverseText;
                this.inverseDisplay.style.display = 'block';
            }

            checkAnswer() {
                const userAnswer = parseInt(this.answerInput.value);
                
                if (isNaN(userAnswer)) {
                    this.feedbackEl.innerHTML = '❌ Please enter a number!';
                    this.feedbackEl.className = 'feedback incorrect';
                    return;
                }

                const isCorrect = userAnswer === this.currentAnswer;

                if (isCorrect) {
                    this.feedbackEl.innerHTML = '✅ Correct! Amazing job! 🌟';
                    this.feedbackEl.className = 'feedback correct';
                    
                    this.answeredCorrectly = true;
                    
                    // Mark fact as completed
                    if (!this.completedFacts[this.currentFact - 1]) {
                        this.completedFacts[this.currentFact - 1] = true;
                    }
                    
                    // Show the full inverse relationship
                    this.showFullInverse();
                    
                    // Enable next button
                    this.nextBtn.disabled = false;
                    
                    // Update progress display
                    this.updateProgressBars();
                } else {
                    this.feedbackEl.innerHTML = '❌ Try again! You can do it! 💪';
                    this.feedbackEl.className = 'feedback incorrect';
                    
                    // Show hint automatically on wrong answer
                    this.showHint();
                }
            }

            nextQuestion() {
                if (this.answeredCorrectly) {
                    this.generateNewQuestion();
                }
            }

            updateProgressBars() {
                let html = '';
                for (let i = 1; i <= 10; i++) {
                    let classes = 'fact-pill';
                    if (this.completedFacts[i - 1]) {
                        classes += ' completed';
                    }
                    if (i === this.currentFact && !this.answeredCorrectly) {
                        classes += ' current';
                    }
                    html += `<div class="${classes}">${i}</div>`;
                }
                this.progressBars.innerHTML = html;
            }
        }

        // Initialize the app when the page loads
        window.addEventListener('load', () => {
            new TimesTableApp();
        });
    </script>
</body>
</html>
