<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuizMaster Pro – Divide by 10</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f8fb;
    margin: 0;
    padding: 0;
}
header {
    background: #2b7de9;
    color: white;
    padding: 15px;
    text-align: center;
}
.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
}
h2 {
    color: #2b7de9;
}
.question {
    font-size: 1.2em;
    margin-bottom: 10px;
}
input[type="number"], input[type="text"] {
    padding: 8px;
    font-size: 1em;
    width: 100px;
}
button {
    padding: 10px 15px;
    background: #2b7de9;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}
button:hover {
    background: #1f5fbf;
}
.feedback {
    margin-top: 15px;
    padding: 10px;
    border-radius: 4px;
}
.correct {
    background: #e0f7e9;
    color: #0a7a3c;
}
.incorrect {
    background: #fde2e2;
    color: #a40000;
}
.nav {
    margin-top: 20px;
}
.progress {
    margin: 10px 0;
}
.dashboard {
    margin-top: 30px;
    padding: 15px;
    background: #f0f4f8;
    border-radius: 6px;
}
</style>
</head>

<body>

<header>
    <h1>QuizMaster Pro</h1>
    <p>Divide by 10 – Interactive Maths Quiz</p>
    <p>Score: <span id="score">0</span> / <span id="total"></span></p>
</header>

<div class="container">

<div class="progress">
    Question <span id="qNum">1</span> of <span id="total2"></span>
</div>

<div id="quizArea"></div>

<div class="nav">
    <button onclick="submitAnswer()">Submit</button>
    <button onclick="nextQuestion()">Next</button>
</div>

<div id="feedback" class="feedback" style="display:none;"></div>

<div class="dashboard">
    <h3>Performance Dashboard</h3>
    <p>Correct answers: <span id="correctCount">0</span></p>
    <p>Incorrect answers: <span id="wrongCount">0</span></p>
    <p>Percentage score: <span id="percent">0</span>%</p>
</div>

</div>

<script>
const questions = [
{
    q: "Kara has 40 bean seeds. She plants rows of 10. How many rows can she plant?",
    a: "4",
    exp: "40 ÷ 10 = 4, so she can plant 4 rows."
},
{
    q: "Complete the number fact: 60 ÷ 10 = ?",
    a: "6",
    exp: "Dividing by 10 removes one zero. 60 ÷ 10 = 6."
},
{
    q: "Complete the number fact: 30 ÷ 10 = ?",
    a: "3",
    exp: "30 divided by 10 equals 3."
},
{
    q: "Complete the number fact: 50 ÷ 10 = ?",
    a: "5",
    exp: "50 ÷ 10 = 5."
},
{
    q: "I know 3 × 10 = 30, so 30 ÷ 10 = ?",
    a: "3",
    exp: "Division undoes multiplication. 30 ÷ 10 = 3."
},
{
    q: "I know 7 × 10 = 70, so 70 ÷ 10 = ?",
    a: "7",
    exp: "70 divided by 10 equals 7."
},
{
    q: "Complete: ___ ÷ 10 = 9",
    a: "90",
    exp: "9 × 10 = 90, so 90 ÷ 10 = 9."
},
{
    q: "Complete: 2 × ___ = 20",
    a: "10",
    exp: "2 times 10 equals 20."
},
{
    q: "Crack the code: ★ × 10 = 30. What is ★?",
    a: "3",
    exp: "3 × 10 = 30, so ★ = 3."
},
{
    q: "Crack the code: ★ × 10 = 70. What is ★?",
    a: "7",
    exp: "7 × 10 = 70, so ★ = 7."
}
];

let index = 0;
let score = 0;
let correct = 0;
let wrong = 0;

document.getElementById("total").textContent = questions.length;
document.getElementById("total2").textContent = questions.length;

function loadQuestion() {
    const q = questions[index];
    document.getElementById("quizArea").innerHTML = `
        <div class="question">${q.q}</div>
        <input type="number" id="answer" aria-label="Your answer">
    `;
    document.getElementById("feedback").style.display = "none";
    document.getElementById("qNum").textContent = index + 1;
}

function submitAnswer() {
    const userAnswer = document.getElementById("answer").value;
    const feedback = document.getElementById("feedback");

    if (userAnswer === "") return;

    if (userAnswer === questions[index].a) {
        feedback.className = "feedback correct";
        feedback.innerHTML = "✅ Correct!<br>" + questions[index].exp;
        score++;
        correct++;
    } else {
        feedback.className = "feedback incorrect";
        feedback.innerHTML = "❌ Incorrect.<br>Correct answer: <b>" +
            questions[index].a + "</b><br>" + questions[index].exp;
        wrong++;
    }

    document.getElementById("score").textContent = score;
    document.getElementById("correctCount").textContent = correct;
    document.getElementById("wrongCount").textContent = wrong;
    document.getElementById("percent").textContent =
        Math.round((score / questions.length) * 100);

    feedback.style.display = "block";
}

function nextQuestion() {
    if (index < questions.length - 1) {
        index++;
        loadQuestion();
    } else {
        document.getElementById("quizArea").innerHTML =
            "<h2>🎉 Quiz Complete!</h2><p>Well done for practicing dividing by 10.</p>";
    }
}

loadQuestion();
</script>

<!--
How to use:
1. Type your answer in the box.
2. Click Submit to see instant feedback and explanation.
3. Click Next to move on.
-->

</body>
</html>
