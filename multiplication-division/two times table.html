<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Division & Multiplication Fact Practice</title>
  <style>
    :root{
      --bg1:#2a0aa8;
      --bg2:#6a00ff;
      --panel:#ffffff;
      --ink:#1f2937;
      --muted:#6b7280;
      --accent:#7c3aed;
      --accent2:#a855f7;
      --good:#22c55e;
      --bad:#ef4444;
      --hint:#f59e0b;
      --bar:#10b981;
      --shadow: 0 20px 60px rgba(0,0,0,.22);
      --radius:16px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--ink);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(1200px 700px at 20% 15%, rgba(255,255,255,.18), transparent 55%),
        radial-gradient(900px 600px at 80% 30%, rgba(255,255,255,.14), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      padding:24px;
    }

    .wrap{ width:min(920px, 100%); }

    .header{
      background: linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      color:#fff;
      border-radius:20px;
      padding:18px 22px;
      box-shadow: var(--shadow);
      margin-bottom:16px;
      backdrop-filter: blur(6px);
    }

    .titleRow{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:.2px;
      font-size:20px;
    }

    .sub{
      margin-top:4px;
      color: rgba(255,255,255,.85);
      font-size:13px;
      font-weight:500;
    }

    .card{
      background: rgba(255,255,255,.92);
      border-radius: var(--radius);
      padding:18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.55);
    }

    .topRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .qcount{
      font-size:13px;
      color:var(--muted);
      font-weight:600;
    }

    .pct{
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }

    .progressOuter{
      width:100%;
      height:10px;
      border-radius:999px;
      background: rgba(17,24,39,.10);
      overflow:hidden;
      margin: 6px 0 14px;
    }

    .progressInner{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--bar), #34d399);
      border-radius:999px;
      transition: width .35s ease;
    }

    .qtitle{
      font-size:14px;
      color: #4b5563;
      font-weight:800;
      margin-bottom:10px;
    }

    .questionBox{
      display:flex;
      gap:14px;
      align-items:flex-start;
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(17,24,39,.10);
      padding:16px;
    }

    .leftMark{
      width:6px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius:999px;
      flex:0 0 auto;
      margin-top:2px;
      height:48px;
    }

    .qtext{
      font-size:18px;
      line-height:1.35;
      font-weight:700;
      color:#111827;
    }

    .answerArea{
      margin-top:16px;
    }

    label{
      display:block;
      font-size:12px;
      color: var(--muted);
      font-weight:700;
      margin-bottom:8px;
    }

    .inputRow{
      display:flex;
      gap:12px;
      align-items:center;
    }

    input[type="text"]{
      width:100%;
      padding:14px 14px;
      border-radius:12px;
      border:2px solid rgba(124,58,237,.35);
      outline:none;
      font-size:16px;
      font-weight:700;
      background:#fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input[type="text"]:focus{
      border-color: rgba(124,58,237,.75);
      box-shadow: 0 0 0 4px rgba(124,58,237,.16);
    }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top:14px;
    }

    button{
      border:0;
      padding:12px 14px;
      border-radius:12px;
      font-weight:800;
      cursor:pointer;
      transition: transform .06s ease, filter .15s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      user-select:none;
      min-height:44px;
    }
    button:active{ transform: translateY(1px); }

    .btnPrimary{
      flex:1;
      color:#fff;
      background: linear-gradient(90deg, #10b981, #22c55e);
    }
    .btnHint{
      flex:1;
      color:#fff;
      background: linear-gradient(90deg, #fb7185, #f97316);
    }

    .feedback{
      margin-top:14px;
      padding:12px 12px;
      border-radius:12px;
      background: rgba(17,24,39,.04);
      border: 1px solid rgba(17,24,39,.08);
      display:none;
    }
    .feedback.show{ display:block; }

    .feedback.good{
      background: rgba(34,197,94,.10);
      border-color: rgba(34,197,94,.25);
    }
    .feedback.bad{
      background: rgba(239,68,68,.10);
      border-color: rgba(239,68,68,.25);
    }

    .fbTitle{
      font-weight:900;
      margin-bottom:6px;
    }
    .fbBody{
      color:#111827;
      font-weight:650;
      line-height:1.35;
      font-size:14px;
      white-space:pre-line;
    }

    .statsRow{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
      margin-top:14px;
    }
    .stat{
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(17,24,39,.08);
      border-radius:14px;
      padding:14px;
      text-align:center;
    }
    .statNum{
      font-size:26px;
      font-weight:900;
      color:#111827;
      margin-bottom:2px;
    }
    .statLbl{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.2px;
    }

    .footerNote{
      margin-top:10px;
      font-size:12px;
      color: rgba(17,24,39,.65);
      font-weight:650;
    }

    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight:800;
      background: rgba(17,24,39,.08);
      padding:2px 6px;
      border-radius:7px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="titleRow">
        <span aria-hidden="true">🧮</span>
        <span>Division & Multiplication Fact Practice</span>
      </div>
      <div class="sub">Match each division to a multiplication fact — complete the divisions and use related facts.</div>
    </div>

    <div class="card">
      <div class="topRow">
        <div class="qcount" id="qCount">Question 1 of 10</div>
        <div class="pct" id="pct">10%</div>
      </div>
      <div class="progressOuter" aria-label="progress">
        <div class="progressInner" id="bar"></div>
      </div>

      <div class="qtitle" id="qTitle">Question 1</div>

      <div class="questionBox">
        <div class="leftMark"></div>
        <div class="qtext" id="qText">Loading...</div>
      </div>

      <div class="answerArea">
        <label for="ans">Your Answer:</label>
        <div class="inputRow">
          <input id="ans" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter your answer here" />
        </div>

        <div class="btnRow">
          <button class="btnPrimary" id="submitBtn">Submit Answer</button>
          <button class="btnHint" id="hintBtn">Show Hint</button>
        </div>

        <div class="feedback" id="feedback">
          <div class="fbTitle" id="fbTitle"></div>
          <div class="fbBody" id="fbBody"></div>
        </div>
      </div>

      <div class="statsRow" role="status" aria-label="scoreboard">
        <div class="stat">
          <div class="statNum" id="correct">0</div>
          <div class="statLbl">Correct Answers</div>
        </div>
        <div class="stat">
          <div class="statNum" id="incorrect">0</div>
          <div class="statLbl">Incorrect Answers</div>
        </div>
        <div class="stat">
          <div class="statNum" id="hints">0</div>
          <div class="statLbl">Hints Used</div>
        </div>
      </div>

      <div class="footerNote">
        Tip: You can press <span class="kbd">Enter</span> to submit.
      </div>
    </div>
  </div>

  <script>
    // ====== QUESTION BANK (derived from extracted material) ======
    // Focus: divisions by 2 and related multiplication facts x2, plus a "Reflect" style question.
    const QUESTIONS = [
      // Complete the divisions
      makeDivBy2Question(8),
      makeDivBy2Question(12),
      makeDivBy2Question(2),

      // Form: ___ ÷ 2 = k  (student provides dividend)
      makeMissingDividendQuestion(2), // __ ÷ 2 = 2
      makeMissingDividendQuestion(5), // __ ÷ 2 = 5
      makeMissingDividendQuestion(7), // __ ÷ 2 = 7

      // Extra similar items (same theme)
      makeDivBy2Question(16),
      makeMissingDividendQuestion(4),
      makeDivBy2Question(10),

      // Reflect-style
      makeReflectQuestion(5) // 5×2=10 therefore 10÷2=5
    ];

    // ====== STATE ======
    let idx = 0;
    let correct = 0;
    let incorrect = 0;
    let hints = 0;
    let revealedSolution = false;

    // ====== ELEMENTS ======
    const qCountEl = document.getElementById("qCount");
    const pctEl = document.getElementById("pct");
    const barEl = document.getElementById("bar");
    const qTitleEl = document.getElementById("qTitle");
    const qTextEl = document.getElementById("qText");
    const ansEl = document.getElementById("ans");
    const submitBtn = document.getElementById("submitBtn");
    const hintBtn = document.getElementById("hintBtn");
    const feedbackEl = document.getElementById("feedback");
    const fbTitleEl = document.getElementById("fbTitle");
    const fbBodyEl = document.getElementById("fbBody");
    const correctEl = document.getElementById("correct");
    const incorrectEl = document.getElementById("incorrect");
    const hintsEl = document.getElementById("hints");

    // ====== HELPERS ======
    function normalizeNumericInput(s){
      // allow whitespace, commas, "g", etc. -> keep digits and minus.
      return (s || "").toString().trim().replace(/[^0-9\-]/g, "");
    }

    function setFeedback(type, title, body){
      feedbackEl.classList.remove("good","bad","show");
      feedbackEl.classList.add("show", type);
      fbTitleEl.textContent = title;
      fbBodyEl.textContent = body;
    }

    function clearFeedback(){
      feedbackEl.classList.remove("good","bad","show");
      fbTitleEl.textContent = "";
      fbBodyEl.textContent = "";
    }

    function updateStats(){
      correctEl.textContent = String(correct);
      incorrectEl.textContent = String(incorrect);
      hintsEl.textContent = String(hints);
    }

    function updateProgress(){
      const total = QUESTIONS.length;
      const qNum = idx + 1;
      qCountEl.textContent = `Question ${qNum} of ${total}`;
      const pct = Math.round((qNum / total) * 100);
      pctEl.textContent = `${pct}%`;
      barEl.style.width = `${pct}%`;
      qTitleEl.textContent = `Question ${qNum}`;
    }

    function loadQuestion(){
      revealedSolution = false;
      clearFeedback();
      ansEl.value = "";
      ansEl.focus();

      const q = QUESTIONS[idx];
      qTextEl.textContent = q.prompt;
      updateProgress();
    }

    function nextQuestion(){
      idx++;
      if(idx >= QUESTIONS.length){
        finish();
      }else{
        loadQuestion();
      }
    }

    function finish(){
      // simple finish state (keeps the same UI)
      qTextEl.textContent = `Done! You completed all ${QUESTIONS.length} questions.`;
      qTitleEl.textContent = "Finished";
      qCountEl.textContent = `Question ${QUESTIONS.length} of ${QUESTIONS.length}`;
      pctEl.textContent = "100%";
      barEl.style.width = "100%";
      ansEl.disabled = true;
      submitBtn.disabled = true;
      hintBtn.disabled = true;

      const body =
        `Score summary:\n` +
        `• Correct: ${correct}\n` +
        `• Incorrect: ${incorrect}\n` +
        `• Hints used: ${hints}\n\n` +
        `If you missed any, use the “related fact” idea:\n` +
        `Division and multiplication undo each other. If a × 2 = b, then b ÷ 2 = a.`;
      setFeedback("good", "All set ✅", body);
    }

    // ====== QUESTION BUILDERS ======
    function makeDivBy2Question(dividend){
      const answer = dividend / 2;
      return {
        type: "div",
        prompt: `Complete the division: ${dividend} ÷ 2 = ____`,
        check: (raw) => Number(normalizeNumericInput(raw)) === answer,
        hint: () => {
          // Give a multiplication fact clue
          return `Think of the matching multiplication fact:\n` +
                 `____ × 2 = ${dividend}\n` +
                 `So the blank is the number that doubles to make ${dividend}.`;
        },
        workedExampleIfWrong: (raw) => {
          return `Work it out using a related fact:\n` +
                 `Find a number that makes ${dividend} when multiplied by 2.\n` +
                 `${answer} × 2 = ${dividend}\n` +
                 `So ${dividend} ÷ 2 = ${answer}.`;
        },
        solution: `${answer}`
      };
    }

    function makeMissingDividendQuestion(quotient){
      const dividend = quotient * 2;
      return {
        type: "missingDividend",
        prompt: `Fill in the missing number: ____ ÷ 2 = ${quotient}`,
        check: (raw) => Number(normalizeNumericInput(raw)) === dividend,
        hint: () => {
          return `Use the inverse relationship:\n` +
                 `If ____ ÷ 2 = ${quotient}, then ____ = ${quotient} × 2.\n` +
                 `Compute ${quotient} × 2 to find the missing number.`;
        },
        workedExampleIfWrong: (raw) => {
          return `Work it out step-by-step:\n` +
                 `Missing number = ${quotient} × 2\n` +
                 `${quotient} × 2 = ${dividend}\n` +
                 `So the blank is ${dividend}.`;
        },
        solution: `${dividend}`
      };
    }

    function makeReflectQuestion(multiplier){
      const product = multiplier * 2;
      return {
        type: "reflect",
        prompt: `Reflect: I know that ${multiplier} × 2 = ${product}.\nSo I know that ${product} ÷ 2 = ____`,
        check: (raw) => Number(normalizeNumericInput(raw)) === multiplier,
        hint: () => {
          return `Division undoes multiplication:\n` +
                 `Because ${multiplier} × 2 = ${product},\n` +
                 `then ${product} ÷ 2 must equal ${multiplier}.`;
        },
        workedExampleIfWrong: (raw) => {
          return `Work it out using the given fact:\n` +
                 `${multiplier} × 2 = ${product}\n` +
                 `Division is the opposite of multiplying by 2.\n` +
                 `So ${product} ÷ 2 = ${multiplier}.`;
        },
        solution: `${multiplier}`
      };
    }

    // ====== HANDLERS ======
    function onHint(){
      const q = QUESTIONS[idx];
      hints++;
      updateStats();
      setFeedback("good", "Hint 💡", q.hint());
    }

    function onSubmit(){
      const q = QUESTIONS[idx];
      const raw = ansEl.value;

      // require some input
      if(!normalizeNumericInput(raw)){
        setFeedback("bad", "Enter an answer", "Type a number, then press Submit.");
        return;
      }

      const ok = q.check(raw);

      if(ok){
        correct++;
        updateStats();
        setFeedback("good", "Correct ✅", `Nice. The answer is ${q.solution}.`);
        // small delay so user can see feedback
        setTimeout(nextQuestion, 650);
      }else{
        incorrect++;
        updateStats();

        // Show a worked-out explanation + hint-like scaffolding
        const worked = q.workedExampleIfWrong(raw);

        setFeedback(
          "bad",
          "Not quite ❌",
          `${worked}\n\nTry again (or click “Show Hint”).`
        );
      }
    }

    // ====== INIT ======
    submitBtn.addEventListener("click", onSubmit);
    hintBtn.addEventListener("click", onHint);
    ansEl.addEventListener("keydown", (e) => {
      if(e.key === "Enter") onSubmit();
    });

    loadQuestion();
  </script>
</body>
</html>
